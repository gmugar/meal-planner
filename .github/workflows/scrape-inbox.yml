name: Weekly inbox refresh

# Pulls fresh recipe ideas from the sites in sources.json into inbox.json,
# which the app loads to populate its "Weekly picks" inbox.

on:
  schedule:
    - cron: '0 10 * * 1'   # every Monday 10:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-inbox
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape recipe sources
        run: node scripts/scrape-inbox.mjs

      - name: Commit inbox.json if changed
        run: |
          if git diff --quiet -- inbox.json; then
            echo "No inbox changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox.json
          git commit -m "Weekly inbox refresh"
          git push
