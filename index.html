    btn.onclick = function() { confirmImport(recipe); };
  };
}

// Prefer our own service once its deployed URL is configured.
async function fetchRecipeHtml(url) {
  if (!RECIPE_FETCH_URL) return fetchHtmlViaProxies(url);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const endpoint = new URL('/recipe', RECIPE_FETCH_URL);
    endpoint.searchParams.set('url', url);
    const response = await fetch(endpoint.href, { signal: controller.signal });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'The recipe service could not retrieve this page.');
    if (typeof result.html !== 'string' || !result.html.trim()) throw new Error('The recipe page was empty.');
    return result.html;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('The recipe service took too long to respond.');
    throw error;
  } finally { clearTimeout(timeout); }
}

// Fetch a page's HTML through CORS proxies. Returns the HTML string or null.
async function fetchHtmlViaProxies(url) {
  const proxies = [
    { url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(url), json: true, field: 'contents' },
    { url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), json: false }
  ];
  for (const proxy of proxies) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(proxy.url, { signal: controller.signal });
      if (!res.ok) continue;
      let html = proxy.json ? (await res.json())[proxy.field] : await res.text();
      if (typeof html === 'string' && html.trim()) return html;
    } catch(e) { continue; } finally { clearTimeout(timeout); }
  }
  return null;
}

// Split a raw ingredient line into { qty, name } by matching a leading amount+unit.
function splitQtyName(raw) {
  const ing = String(raw).replace(/<[^>]*>/g, '').trim();
  const match = ing.match(/^([\d¼½¾⅓⅔⅛\s\/\.\-]+(?:\s*(?:cup|cups|tbsp|tsp|oz|lb|lbs|pound|pounds|g|kg|ml|L|clove|cloves|can|cans|bunch|head|large|medium|small|pinch|dash|to taste|tablespoon|tablespoons|teaspoon|teaspoons|ounce|ounces|slice|slices|piece|pieces)s?)?)\s+(.+)/i);
  if (match) return { name: match[2].trim(), qty: match[1].trim() };
  return { name: ing, qty: '' };
}

// Parse a textarea of ingredient lines (one per line) into categorized groups.
function parseIngredientLines(text) {
  const items = String(text).split('\n').map(l => l.trim()).filter(Boolean).map(splitQtyName);
  return items.length ? autoCategorize(items) : [];
}

function autoCategorize(items) {
  const rules = {
    'Meat': /\b(chicken|beef|pork|lamb|turkey|bacon|sausage|steak|ground|mince|ham|prosciutto|salami|pepperoni|shrimp|prawns|salmon|tuna|fish|cod|tilapia|crab|lobster|scallop|meatball|chorizo|duck|veal|brisket|ribs)\b/i,
    'Produce': /\b(garlic|onion|tomato|lettuce|spinach|kale|carrot|celery|pepper|potato|sweet potato|broccoli|cauliflower|zucchini|squash|cucumber|avocado|mushroom|corn|pea|bean sprout|bok choy|cabbage|ginger|lemon|lime|orange|apple|banana|berry|basil|cilantro|parsley|mint|dill|thyme|rosemary|scallion|shallot|jalapen|chili|chilli|arugula|radish|beet|asparagus|eggplant|artichoke|leek|fennel|watercress|endive|turnip|pickl)\b/i,
    'Dairy': /\b(cheese|milk|cream|butter|yogurt|sour cream|mozzarella|parmesan|cheddar|feta|ricotta|gouda|brie|egg|eggs|whipping|half.and.half|crème|mascarpone)\b/i,
    'Pantry': /\b(oil|olive oil|vinegar|soy sauce|tamari|ketchup|mustard|mayo|mayonnaise|honey|sugar|flour|bread|tortilla|wrap|rice|pasta|noodle|broth|stock|sauce|sriracha|hot sauce|worcestershire|fish sauce|hoisin|teriyaki|peanut butter|jam|maple|molasses|cornstarch|baking|yeast|cocoa|chocolate|coconut milk|tomato paste|passata|can|canned|dried|bean|lentil|chickpea)\b/i,
    'Spices': /\b(salt|pepper|paprika|cumin|oregano|cinnamon|nutmeg|cayenne|chili powder|garlic powder|onion powder|turmeric|coriander|cardamom|clove|bay leaf|bay leaves|italian seasoning|taco seasoning|curry|garam masala|red pepper flake|sesame seed|poppy|vanilla|extract)\b/i
  };
  const cats = {};
  const uncategorized = [];
  items.forEach(item => {
    let matched = false;
    for (const [cat, regex] of Object.entries(rules)) {
      if (regex.test(item.name)) {
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push(item);
        matched = true;
        break;
      }
    }
    if (!matched) uncategorized.push(item);
  });
  const result = [];
  const order = ['Meat','Produce','Dairy','Pantry','Spices'];
  order.forEach(cat => { if (cats[cat]) result.push({cat, items: cats[cat]}); });
  if (uncategorized.length > 0) result.push({cat: 'Other', items: uncategorized});
  if (result.length === 0) result.push({cat: 'Ingredients', items: items});
  return result;
}

function parseRecipeFromHtml(html, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Try JSON-LD structured data first
  const ldScripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for (const script of ldScripts) {
    try {
      let jsonData = JSON.parse(script.textContent);
      // Handle @graph arrays
      if (jsonData['@graph']) jsonData = jsonData['@graph'];
      if (Array.isArray(jsonData)) {
        const found = jsonData.find(item => item['@type'] === 'Recipe' || (Array.isArray(item['@type']) && item['@type'].includes('Recipe')));
        if (found) jsonData = found;
        else continue;
      }
      if (jsonData['@type'] === 'Recipe' || (Array.isArray(jsonData['@type']) && jsonData['@type'].includes('Recipe'))) {
        return buildRecipeFromLD(jsonData, url);
      }
    } catch(e) { continue; }
  }

  // Fallback: try meta tags
  const title = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.textContent || '';
  if (!title) return null;

  return {
    id: 'custom_' + Date.now(),
    name: title.split('|')[0].split('-')[0].trim(),
    site: new URL(url).hostname.replace('www.',''),
    url: url,
    desc: doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || '',
    tags: [],
    servings: 4,
    ingredients: [{cat:'Ingredients', items:[{name:'(imported — edit ingredients manually)', qty:''}]}],
    custom: true
  };
}

function buildRecipeFromLD(ld, url) {
  const name = ld.name || 'Unnamed Recipe';
  const desc = ld.description || '';
  const servings = parseInt(ld.recipeYield) || (Array.isArray(ld.recipeYield) ? parseInt(ld.recipeYield[0]) : 4) || 4;
  const site = new URL(url).hostname.replace('www.','');

  // Parse ingredients
  const rawIngredients = ld.recipeIngredient || ld.ingredients || [];
  const items = rawIngredients.map(splitQtyName);

  // Detect tags
  const tags = [];
  const cats = (ld.recipeCategory || []);
  const cuisines = (ld.recipeCuisine || []);
  const keywords = (ld.keywords || '');
  const allText = [name, desc, ...cats, ...cuisines, keywords].join(' ').toLowerCase();
  if (allText.includes('dairy-free') || allText.includes('dairy free')) tags.push('dairy-free');
  if (allText.includes('gluten-free') || allText.includes('gluten free')) tags.push('gluten-free');
  if (allText.includes('one-pan') || allText.includes('one pan') || allText.includes('sheet pan')) tags.push('one-pan');
  if (allText.includes('one-pot') || allText.includes('one pot')) tags.push('one-pot');

  return {
    id: 'custom_' + Date.now(),
    name: name,
    site: site,
    url: url,
    desc: desc.substring(0, 200),
    tags: tags,
    servings: servings,
    ingredients: autoCategorize(items),
    custom: true
  };
}

function showImportPreview(recipe, container) {
  let h = '<div class="import-preview">';
  h += '<h4>' + esc(recipe.name) + '</h4>';
  h += '<div class="ip-meta">' + esc(recipe.site) + ' &middot; serves ' + esc(recipe.servings) + '</div>';
  if (recipe.desc) h += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + esc(recipe.desc) + '</div>';
  const totalIng = recipe.ingredients.reduce((s,g) => s + g.items.length, 0);
  recipe.ingredients.forEach(g => {
    h += '<div class="ip-section">' + esc(g.cat) + ' (' + g.items.length + ')</div>';
    g.items.slice(0, 10).forEach(item => {
      h += '<div class="ip-item">' + (item.qty ? '<span style="color:var(--muted)">' + esc(item.qty) + '</span> ' : '') + esc(item.name) + '</div>';
    });
    if (g.items.length > 10) h += '<div class="ip-item" style="color:var(--muted)">+ ' + (g.items.length - 10) + ' more...</div>';
  });
  h += '</div>';
  container.innerHTML = h;
}

function confirmImport(recipe) {
  // Check for duplicate
  if (state.customRecipes.some(r => recipe.url && r.url === recipe.url && !r.deleted)) {
    alert('This recipe has already been imported.');
    closeImportModal();
    return;
  }
  const deletedRecipe = state.customRecipes.find(r => recipe.url && r.url === recipe.url && r.deleted);
  if (deletedRecipe) {
    // Keep the original ID, including for seeds, so seeding cannot duplicate it.
    recipe = { ...recipe, id: deletedRecipe.id, deleted: false };
    Object.assign(deletedRecipe, recipe);
  } else {
    state.customRecipes.push(recipe);
  }
  save();
  closeImportModal();
  // Mid-ritual import: drop it straight into the basket.
  if (document.getElementById('planning-wizard') && wizardStep === 1) {
    if (!wizardPicked.includes(recipe.id)) wizardPicked.push(recipe.id);
    renderWizard();
    showToast(recipe.name + ' added to the basket');
  } else {
    showToast(recipe.name + ' added to your library');
  }
  render();
}

function deleteCustomRecipe(id) {
  // Tombstone rather than splice: keeps the id present so seedRecipes() can't
  // resurrect a deleted seeded recipe, and the deletion syncs via custom_recipes.
  const r = state.customRecipes.find(r => r.id === id);
  if (r) r.deleted = true;
  else state.customRecipes = state.customRecipes.filter(x => x.id !== id);
  state.favorites = state.favorites.filter(fid => fid !== id);
  Object.keys(state.calendar).forEach(dk => {
    state.calendar[dk] = state.calendar[dk].filter(mid => mid !== id);
    if (state.calendar[dk].length === 0) delete state.calendar[dk];
  });
  Object.keys(state.checked).forEach(k => {
    if (keyMatchesRecipe(k, id)) delete state.checked[k];
  });
  save();
  render();
}

// Manual ingredient editor — lets any recipe (incl. link-only inbox adds and
// seeded recipes) get real ingredients so it appears on the shopping list.
function openIngredientEditor(id) {
  const r = getAllRecipes().find(r => r.id === id);
  if (!r) return;
  const old = document.getElementById('ingredient-editor-modal');
  if (old) old.remove();
  const lines = [];
  (r.ingredients || []).forEach(g => g.items.forEach(it => lines.push((it.qty ? it.qty + ' ' : '') + it.name)));
  let h = '<div class="modal-overlay" id="ingredient-editor-modal" onclick="if(event.target===this)this.remove()">';
  h += '<div class="modal" style="max-height:85vh">';
  h += '<h3>Edit ingredients</h3>';
  h += '<p class="modal-sub">' + esc(r.name) + ' — one ingredient per line, e.g. "500 g ground beef"</p>';
  h += '<textarea id="ingredient-editor-text" class="import-input" style="min-height:220px;resize:vertical;font-family:var(--font-mono);font-size:13px;line-height:1.6">' + esc(lines.join('\n')) + '</textarea>';
  h += '<div class="import-actions">';
  h += '<button class="modal-cancel" onclick="this.closest(\'.modal-overlay\').remove()" style="width:auto;margin:0">Cancel</button>';
  h += '<button class="btn-import" onclick="saveIngredientEdits(\'' + r.id + '\')">Save ingredients</button>';
  h += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function saveIngredientEdits(id) {
  const r = state.customRecipes.find(r => r.id === id);
  const ta = document.getElementById('ingredient-editor-text');
  if (!r || !ta) return;
  r.ingredients = parseIngredientLines(ta.value);
  r.linkOnly = false;
  save();
  const m = document.getElementById('ingredient-editor-modal');
  if (m) m.remove();
  closeRecipeDetail();
  render();
  showToast('Ingredients saved');
}

/* Clean an ingredient name for the copyable grocery list.
   Removes parenthetical notes and a trailing prep/qualifier clause (", diced",
   ", shredded", ", large", ", for serving"…), but NEVER drops the part of the
   name that identifies the item. So "Boneless, skinless chicken breast" stays
   whole, while "Cheddar cheese, shredded" becomes "Cheddar cheese". */
function cleanItemNameForCopy(raw) {
  var n = String(raw).replace(/\([^)]*\)/g, '').trim();   // drop (optional), (for sauce), etc.
  var prep = /^(diced|chopped|minced|sliced|shredded|grated|crushed|crumbled|ground|uncooked|cooked|drained|rinsed|peeled|seeded|halved|quartered|cubed|julienned|thinly sliced|finely chopped|roughly chopped|large|small|medium|to taste|to serve|for serving|for garnish|optional)\b/i;
  var parts = n.split(',');
  while (parts.length > 1 && prep.test(parts[parts.length - 1].trim())) {
    parts.pop();
  }
  return parts.join(',').replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim();
}

/* ── Copy shopping list (name-first for DoorDash/Instacart) ── */
function copyShoppingList() {
  const shopMealIds = getMenu(shopWeekOffset);
  const shopList = getShoppingList(shopMealIds, shopWeekKey(shopWeekOffset));
  let lines = [];
  shopList.forEach(group => {
    group.items.forEach(item => {
      const isChecked = item.keys.every(k => state.checked[k]);
      if (isChecked) return; // skip checked items
      const name = cleanItemNameForCopy(item.name); // keep item identity, drop only prep qualifiers
      const qty = item.qty;
      lines.push(qty ? name + ' (' + qty + ')' : name);
    });
  });
  const text = lines.join('\n');
  // Copy is the terminal act of the weekly ritual — confirm, then close the loop
  // with a completion banner that returns to Home (which shows the planned week).
  const copied = function() {
    const n = lines.length;
    const btn = document.getElementById('copy-list-btn');
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '&#10003; Copied!';
      setTimeout(() => { const b = document.getElementById('copy-list-btn'); if (b) b.innerHTML = orig; }, 2500);
    }
    const listEl = document.getElementById('list-view');
    if (listEl) {
      let banner = document.getElementById('ritual-done');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'ritual-done';
        listEl.insertBefore(banner, listEl.firstChild);
      }
      banner.style.cssText = 'background:var(--green);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)';
      banner.innerHTML =
        '<div style="font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:4px">&#127881; Your week is planned</div>' +
        '<div style="font-size:13px;opacity:0.92;margin-bottom:14px">' + n + ' item' + (n!==1?'s':'') + ' copied — paste into DoorDash or Instacart to order.</div>' +
        '<button style="background:#fff;color:var(--green-text);border:none;font-weight:700;padding:12px 18px;border-radius:10px;width:100%;font-size:15px;cursor:pointer" onclick="showView(\'home\')">Back to this week &#8250;</button>';
      banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    showToast(n + ' item' + (n!==1?'s':'') + ' copied');
  };
  navigator.clipboard.writeText(text).then(copied).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    copied();
  });
}
