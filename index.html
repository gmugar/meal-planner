<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Meal Planner & Shopping List</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f6f3;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--border:#e5e3de;--accent:#d85a30;--accent-light:#faece7;--accent-text:#712b13;--green:#1d9e75;--green-light:#e1f5ee;--green-text:#085041;--blue:#378add;--blue-light:#e6f1fb;--blue-text:#0c447c;--purple:#7f77dd;--purple-light:#eeedfe;--purple-text:#3c3489;--gold:#ba7517;--gold-light:#faeeda;--gold-text:#633806;--shadow:0 1px 3px rgba(0,0,0,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:99;overflow-x:auto}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;margin-left:4px;background:var(--accent-light);color:var(--accent-text)}
.view{display:none;padding:16px}
.view.active{display:block}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title-row{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0}
.card h3{font-size:16px;font-weight:500;line-height:1.3}
.card .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag-df{background:var(--green-light);color:var(--green-text)}
.tag-gf{background:var(--blue-light);color:var(--blue-text)}
.tag-one{background:var(--purple-light);color:var(--purple-text)}
.card .desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.card .source{font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:8px}
.card .source-site{font-size:11px;color:var(--muted);margin-left:8px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-add{background:var(--accent);color:#fff}
.btn-add:active{transform:scale(0.96)}
.btn-remove{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-remove:active{transform:scale(0.96)}
.btn-sm{padding:8px 14px;font-size:13px}
.card-actions{display:flex;gap:6px;align-items:flex-start;flex-shrink:0}
.btn-star{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;line-height:1;color:var(--border);transition:all 0.15s}
.btn-star.starred{color:var(--gold)}
.btn-star:active{transform:scale(1.2)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty p{font-size:14px;margin-top:8px}
.empty .icon{font-size:40px;opacity:0.3}
.section-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.shop-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.shop-item:last-child{border-bottom:none}
.shop-item input[type=checkbox]{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.shop-item.checked .item-name{text-decoration:line-through;color:var(--muted)}
.item-details{flex:1;min-width:0}
.item-name{font-size:15px;line-height:1.4}
.item-qty{font-size:13px;color:var(--muted);margin-top:2px}
.item-meals{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.meal-dot{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.progress-bar{background:var(--bg);border-radius:8px;height:6px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:8px;transition:width 0.3s}
.progress-text{font-size:13px;color:var(--muted);margin-bottom:16px}
.list-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-outline{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--muted);cursor:pointer}
.btn-outline:active{background:var(--bg)}
.summary-bar{background:var(--card);padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.summary-bar .count{font-size:14px;font-weight:500}
.summary-bar .servings{font-size:13px;color:var(--muted)}
.fav-banner{background:var(--gold-light);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--gold-text);display:flex;align-items:center;gap:8px}
@media(min-width:600px){
  .view{max-width:600px;margin:0 auto}
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cards-grid .card{margin-bottom:0}
}
</style>
</head>
<body>

<div id="favorites-view" class="view"></div>
<div id="meals-view" class="view"></div>
<div id="list-view" class="view"></div>
<script>

let state = JSON.parse(localStorage.getItem('mealPlannerState')||'null') || {selected:[],checked:{},favorites:[]};
if (!state.favorites) state.favorites = [];
function save(){localStorage.setItem('mealPlannerState',JSON.stringify(state))}
function showView(view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));const views=['browse','favorites','meals','list'];document.getElementById(view+'-view').classList.add('active');document.querySelectorAll('.tab')[views.indexOf(view)].classList.add('active');render()}
function toggleMeal(id){const idx=state.selected.indexOf(id);if(idx===-1){state.selected.push(id)}else{state.selected.splice(idx,1);Object.keys(state.checked).forEach(k=>{if(k.startsWith(id+'|'))delete state.checked[k]})}save();render()}
function toggleFavorite(id){const idx=state.favorites.indexOf(id);if(idx===-1){state.favorites.push(id)}else{state.favorites.splice(idx,1)}save();render()}
function toggleCheck(key){state.checked[key]=!state.checked[key];save();render()}
function uncheckAll(){state.checked={};save();render()}
function getShoppingList(){const catOrder=['Meat','Produce','Dairy','Pantry','Spices','Noodles & Pasta'];const groups={};state.selected.forEach(id=>{const r=RECIPES.find(r=>r.id===id);if(!r)return;r.ingredients.forEach(g=>{if(!groups[g.cat])groups[g.cat]=[];g.items.forEach(item=>{groups[g.cat].push({name:item.name,qty:item.qty,meal:r.name,mealId:r.id,key:r.id+'|'+item.name})})})});const consolidated={};Object.keys(groups).forEach(cat=>{consolidated[cat]=[];const seen={};groups[cat].forEach(item=>{const normName=item.name.toLowerCase().replace(/,.*$/,'').trim();if(seen[normName]){seen[normName].meals.push(item.meal);seen[normName].keys.push(item.key);if(item.qty!==seen[normName].qty){seen[normName].qty+=' + '+item.qty}}else{const entry={name:item.name,qty:item.qty,meals:[item.meal],keys:[item.key]};seen[normName]=entry;consolidated[cat].push(entry)}})});const sorted=[];catOrder.forEach(cat=>{if(consolidated[cat])sorted.push({cat,items:consolidated[cat]})});Object.keys(consolidated).forEach(cat=>{if(!catOrder.includes(cat))sorted.push({cat,items:consolidated[cat]})});return sorted}
function toggleCheckGroup(){const keys=Array.from(arguments);const allChecked=keys.every(k=>state.checked[k]);keys.forEach(k=>state.checked[k]=!allChecked);save();render()}
function renderCard(r,isSelected){const isFav=state.favorites.includes(r.id);let html='<div class="card">';html+='<div class="card-header"><div class="card-title-row"><div>';html+='<h3>'+r.name+'</h3>';html+='<div class="tags">';r.tags.forEach(t=>{if(t==='dairy-free')html+='<span class="tag tag-df">DF</span>';else if(t==='gluten-free')html+='<span class="tag tag-gf">GF</span>';else if(t.startsWith('one-'))html+='<span class="tag tag-one">'+t+'</span>';else if(t==='fakeaway')html+='<span class="tag tag-one">fakeaway</span>'});html+='<span class="tag" style="background:var(--bg);color:var(--muted);border:1px solid var(--border)">serves '+r.servings+'</span>';html+='</div></div></div>';html+='<div class="card-actions">';html+='<button class="btn-star'+(isFav?' starred':'')+'" onclick="toggleFavorite(\''+r.id+'\')" aria-label="'+(isFav?'Remove from favorites':'Add to favorites')+'">'+(isFav?'\u2605':'\u2606')+'</button>';if(isSelected){html+='<button class="btn btn-remove btn-sm" onclick="toggleMeal(\''+r.id+'\')">Remove</button>'}else{html+='<button class="btn btn-add btn-sm" onclick="toggleMeal(\''+r.id+'\')">Add</button>'}html+='</div></div>';html+='<p class="desc">'+r.desc+'</p>';html+='<a class="source" href="'+r.url+'" target="_blank">View full recipe \u2197</a>';html+='<span class="source-site">'+r.site+'</span>';html+='</div>';return html}
function render(){const browseEl=document.getElementById('browse-view');const favEl=document.getElementById('favorites-view');const mealsEl=document.getElementById('meals-view');const listEl=document.getElementById('list-view');document.getElementById('browse-count').textContent=RECIPES.length;document.getElementById('meals-count').textContent=state.selected.length;document.getElementById('fav-count').textContent=state.favorites.length;const approved=RECIPES.filter(r=>state.selected.includes(r.id));const available=RECIPES.filter(r=>!state.selected.includes(r.id));let browseHTML='';if(approved.length>0){browseHTML+='<div class="section-label">Approved ('+approved.length+')</div>';approved.forEach(r=>{browseHTML+=renderCard(r,true)})}if(available.length>0){browseHTML+='<div class="section-label">Available ('+available.length+')</div>';available.forEach(r=>{browseHTML+=renderCard(r,false)})}browseEl.innerHTML=browseHTML;const favRecipes=RECIPES.filter(r=>state.favorites.includes(r.id));if(favRecipes.length===0){favEl.innerHTML='<div class="empty"><div class="icon">\u2b50</div><p>No favorites yet.<br>Star recipes you love to save them here.</p></div>'}else{let favHTML='<div class="fav-banner">\u2b50 Your starred recipes \u2014 tap the star on any meal to save it here for easy access.</div>';favRecipes.forEach(r=>{const isSelected=state.selected.includes(r.id);favHTML+=renderCard(r,isSelected)});favEl.innerHTML=favHTML}
if(state.selected.length===0){mealsEl.innerHTML='<div class="empty"><div class="icon">\ud83c\udf5d</div><p>No meals selected yet.<br>Browse and add some meals to get started.</p></div>'}else{const totalServings=state.selected.reduce((sum,id)=>{const r=RECIPES.find(r=>r.id===id);return sum+(r?r.servings:0)},0);let html='<div class="summary-bar" style="margin:-16px -16px 16px;border-radius:0"><div class="count">'+state.selected.length+' meal'+(state.selected.length!==1?'s':'')+'</div><div class="servings">~'+totalServings+' servings</div></div>';state.selected.forEach(id=>{const r=RECIPES.find(r=>r.id===id);if(r)html+=renderCard(r,true)});mealsEl.innerHTML=html}
const shopList=getShoppingList();if(state.selected.length===0){listEl.innerHTML='<div class="empty"><div class="icon">\ud83d\uded2</div><p>Add meals to generate<br>your shopping list.</p></div>';document.getElementById('list-count').textContent='0'}else{let totalItems=0;let checkedItems=0;shopList.forEach(g=>g.items.forEach(item=>{totalItems++;if(item.keys.every(k=>state.checked[k]))checkedItems++}));document.getElementById('list-count').textContent=totalItems-checkedItems||totalItems;const pct=totalItems?Math.round((checkedItems/totalItems)*100):0;let html='<div class="progress-text">'+checkedItems+' of '+totalItems+' items checked</div>';html+='<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';html+='<div class="list-actions"><button class="btn-outline" onclick="uncheckAll()">Uncheck all</button></div>';shopList.forEach(group=>{html+='<div class="section-label">'+group.cat+'</div>';group.items.forEach(item=>{const isChecked=item.keys.every(k=>state.checked[k]);html+='<div class="shop-item'+(isChecked?' checked':'')+'">';html+='<input type="checkbox" '+(isChecked?'checked':'')+' onchange="toggleCheckGroup(\''+item.keys.map(k=>k.replace(/'/g,"\\'")).join("','")+'\')">';html+='<div class="item-details">';html+='<div class="item-name">'+item.name+'</div>';html+='<div class="item-qty">'+item.qty+'</div>';html+='<div class="item-meals">';const uniqueMeals=[...new Set(item.meals)];uniqueMeals.forEach(m=>{html+='<span class="meal-dot">'+m.split(' ').slice(0,3).join(' ')+'</span>'});html+='</div></div></div>'})});listEl.innerHTML=html}}
render();
</script>
</body>
</html>
