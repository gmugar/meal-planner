<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Skillet — One pan. Zero fuss.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5EDE3;--card:#FFFBF5;--text:#2D1B0E;--muted:#8C7B6B;--border:#E0D5C8;--accent:#EF5130;--accent-light:#FDECE8;--accent-text:#8B1A08;--green:#3FA35C;--green-light:#E8F5EC;--green-text:#1E5A2F;--blue:#378add;--blue-light:#e6f1fb;--blue-text:#0c447c;--purple:#7f77dd;--purple-light:#eeedfe;--purple-text:#3c3489;--gold:#D4A017;--gold-light:#FFF8E1;--gold-text:#6D5010;--coral:#EF5130;--coral-light:#FDECE8;--coral-text:#8B1A08;--yolk:#FFC23D;--yolk-light:#FFF3D6;--yolk-text:#6D5010;--tomato:#EF5130;--basil:#3FA35C;--shadow:0 1px 3px rgba(45,27,14,0.06);--font-display:'Bricolage Grotesque',serif;--font-body:'Hanken Grotesk',sans-serif;--font-mono:'DM Mono',monospace}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.header h1{font-family:var(--font-display);font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--text)}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.sync-dot.connected{background:var(--green)}
.sync-dot.connecting{background:var(--gold);animation:pulse 1.5s infinite}
.sync-dot.offline{background:var(--border)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.header-actions{display:flex;gap:6px;align-items:center}
.header-actions .plan-go{padding:6px 12px;font-size:12px}
@media(max-width:500px){.header-actions .btn-text{display:none}.header-actions .btn-icon{display:inline!important}.header-actions .plan-go{padding:6px 10px;font-size:16px;line-height:1}}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:46px;z-index:99;overflow-x:auto}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;margin-left:4px;background:var(--accent-light);color:var(--accent-text)}
.view{display:none;padding:16px}
.view.active{display:block}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title-row{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0}
.card h3{font-size:16px;font-weight:500;line-height:1.3}
.card .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag-df{background:var(--green-light);color:var(--basil)}
.tag-gf{background:var(--yolk-light);color:var(--gold)}
.tag-one{background:var(--accent-light);color:var(--tomato)}
.card .desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.card .source{font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:8px}
.card .source-site{font-size:11px;color:var(--muted);margin-left:8px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-add{background:var(--accent);color:#fff}
.btn-add:active{transform:scale(0.96)}
.btn-remove{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-remove:active{transform:scale(0.96)}
.btn-sm{padding:8px 14px;font-size:13px}
.card-actions{display:flex;gap:6px;align-items:flex-start;flex-shrink:0}
.btn-star{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;line-height:1;color:var(--border);transition:all 0.15s}
.btn-star.starred{color:var(--gold)}
.btn-star:active{transform:scale(1.2)}
.btn-cal-quick{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;line-height:1;color:var(--muted);transition:all 0.15s;opacity:0.6}
.btn-cal-quick:hover{opacity:1;color:var(--accent)}
.btn-cal-quick:active{transform:scale(1.2)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty p{font-size:14px;margin-top:8px;line-height:1.6}
.empty .icon{font-size:48px;opacity:0.25;margin-bottom:4px}
.empty .empty-cta{display:inline-block;margin-top:16px;padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;transition:opacity 0.15s}
.empty .empty-cta:active{opacity:0.85}
.section-label{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.shop-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.shop-item:last-child{border-bottom:none}
.shop-item input[type=checkbox]{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.shop-item.checked .item-name{text-decoration:line-through;color:var(--muted)}
.item-details{flex:1;min-width:0}
.item-name{font-size:15px;line-height:1.4}
.item-qty{font-size:13px;color:var(--muted);margin-top:2px}
.item-meals{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.meal-dot{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.progress-bar{background:rgba(255,255,255,0.3);border-radius:8px;height:6px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:#fff;border-radius:8px;transition:width 0.3s}
.progress-text{font-size:13px;color:rgba(255,255,255,0.85);margin-bottom:16px}
.list-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-outline{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--muted);cursor:pointer}
.btn-outline:active{background:var(--bg)}
.summary-bar{background:var(--card);padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.summary-bar .count{font-size:14px;font-weight:500}
.summary-bar .servings{font-size:13px;color:var(--muted)}
.fav-banner{background:var(--gold-light);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--gold-text);display:flex;align-items:center;gap:8px}
/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-header h2{font-family:var(--font-display);font-size:16px;font-weight:700}
.cal-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--text)}
.cal-nav-btn:active{background:var(--bg)}
.cal-day{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.cal-day-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.cal-day-header .day-name{font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase}
.cal-day-header .day-date{font-size:12px;color:var(--muted)}
.cal-day.today .cal-day-header{background:var(--yolk);color:var(--text)}
.cal-day.today .day-name{color:var(--text);font-family:var(--font-display)}
.cal-day.past{opacity:0.55}
.cal-day.past .cal-day-header{background:var(--bg)}
.cal-day-count{font-size:11px;font-weight:500;padding:2px 7px;border-radius:10px;background:var(--accent-light);color:var(--accent-text)}
.cal-day.past .cal-day-count{background:var(--bg);color:var(--muted)}
.cal-day-meals{padding:8px 12px;min-height:44px;display:flex;flex-direction:column;gap:6px}
.cal-meal{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.cal-meal-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-meal-serves{font-size:11px;color:var(--muted);margin:0 8px;flex-shrink:0}
.cal-meal-remove{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.cal-meal-remove:active{color:var(--accent)}
/* Drag & drop (mouse + touch) */
.drag-handle{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:22px;align-self:stretch;margin-right:2px;color:var(--muted);font-size:15px;line-height:1;cursor:grab;opacity:0.55;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.drag-handle:hover{opacity:1}
.drag-handle:active{cursor:grabbing}
.dragging-source{opacity:0.4}
.drag-ghost{position:fixed;top:0;left:0;z-index:9999;pointer-events:none;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 8px 24px rgba(45,27,14,0.25);opacity:0.96;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;will-change:transform}
.drop-target-active{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-light)}
.cal-meal-type{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:6px;border:none;background:var(--text);color:var(--card);cursor:pointer;flex-shrink:0;text-transform:uppercase;letter-spacing:0.5px;font-weight:500}
.cal-meal-type:active{opacity:0.8}
.cal-meal-type.mt-breakfast{background:var(--yolk);color:var(--text)}
.cal-meal-type.mt-lunch{background:var(--basil);color:#fff}
.cal-meal-type.mt-dinner{background:var(--text);color:var(--card)}
.btn-add-meal{display:flex;align-items:center;gap:6px;padding:12px;border:2px dashed var(--border);border-radius:8px;background:none;color:var(--muted);font-size:13px;cursor:pointer;width:100%;justify-content:center;transition:all 0.15s}
.btn-add-meal:active{border-color:var(--tomato);color:var(--tomato);background:var(--accent-light)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:400;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;padding:20px;animation:slideUp 0.2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .modal-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal-meal{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all 0.1s}
.modal-meal:active{background:var(--accent-light);border-color:var(--accent)}
.modal-meal.added{opacity:0.5;cursor:default}
.modal-meal-info{flex:1;min-width:0}
.modal-meal-name{font-size:14px;font-weight:500}
.modal-meal-tags{font-size:11px;color:var(--muted);margin-top:2px}
.modal-cancel{display:block;width:100%;padding:12px;border:none;background:var(--bg);border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;margin-top:8px}
.modal-cancel:active{background:var(--border)}
/* Recipe Detail Modal */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.detail-header h3{font-size:18px;font-weight:600;line-height:1.3}
.detail-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.detail-close:active{color:var(--text)}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.detail-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.detail-section{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;margin-top:12px}
.detail-ingredient{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:14px}
.detail-ingredient:last-child{border-bottom:none}
.detail-ing-name{flex:1;min-width:0}
.detail-ing-qty{color:var(--muted);font-size:13px;flex-shrink:0;margin-left:12px;text-align:right}
.detail-source{display:inline-block;margin-top:16px;font-size:13px;color:var(--blue);text-decoration:none;padding:10px 16px;border:1px solid var(--blue);border-radius:8px;text-align:center;width:100%}
.detail-source:active{background:var(--blue-light)}
.cal-meal-name{cursor:pointer}
.cal-meal-name:active{color:var(--accent)}
.inbox-section{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.inbox-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.inbox-meal{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--accent-light);border:1px dashed var(--accent);border-radius:8px;margin-bottom:6px}
.inbox-meal:last-child{margin-bottom:0}
.inbox-meal-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.inbox-meal-name:active{color:var(--accent)}
.inbox-meal-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.inbox-assign-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer}
.inbox-assign-btn:active{opacity:0.8}
.inbox-remove-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.inbox-remove-btn:active{color:var(--accent)}
@media(min-width:600px){
  .view{max-width:600px;margin:0 auto}
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cards-grid .card{margin-bottom:0}
}
.tab-icon{display:none}
.card{padding:12px 14px;border-left:3px solid var(--border);transition:border-color 0.15s}
.card.tag-border-onepan{border-left-color:var(--tomato)}
.card.tag-border-fakeaway{border-left-color:var(--yolk)}
.card.tag-border-df{border-left-color:var(--basil)}
.card.tag-border-gf{border-left-color:var(--yolk)}
.card.tag-border-onepot{border-left-color:var(--basil)}
.card .card-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card h3{font-size:15px;cursor:pointer}
.card h3:active{color:var(--accent)}
.card .tags{margin-top:4px}
.progress-ring-wrap{display:flex;align-items:center;gap:16px;margin:8px 0 16px;padding:16px;background:var(--basil);border-radius:12px;box-shadow:var(--shadow);color:#fff}
.progress-ring-info{flex:1}
.progress-ring-info .pr-count{font-family:var(--font-display);font-size:16px;font-weight:700;color:#fff}
.progress-ring-info .pr-hint{font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px}
@media(max-width:400px){
  .tab{flex-direction:column;padding:8px 4px;font-size:11px;gap:2px;display:flex;align-items:center;position:relative}
  .tab-icon{display:block;font-size:18px;line-height:1}
  .tab .badge{position:absolute;top:2px;right:4px;min-width:14px;height:14px;padding:0 3px;font-size:9px;border-radius:7px}
}
/* Saturday planning notification */
.plan-notify{background:var(--accent-light);border:1px solid var(--accent);border-radius:12px;margin:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:slideDown 0.3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.plan-notify .plan-icon{font-size:28px;flex-shrink:0}
.plan-notify .plan-text{flex:1}
.plan-notify .plan-title{font-size:15px;font-weight:600;color:var(--accent-text)}
.plan-notify .plan-sub{font-size:13px;color:var(--muted);margin-top:2px}
.plan-notify .plan-actions{display:flex;gap:8px;flex-shrink:0}
.plan-go{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.plan-go:active{opacity:0.85}
.plan-later{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer}
/* Planning wizard */
.wizard-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300;overflow-y:auto;animation:fadeIn 0.2s ease;-webkit-overflow-scrolling:touch}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wizard-header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:301}
.wizard-header h2{font-size:18px;font-weight:600}
.wizard-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.wizard-body{padding:16px;max-width:600px;margin:0 auto}
.wizard-step{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.wizard-hint{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.wizard-recipe{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer;transition:all 0.15s}
.wizard-recipe:active{transform:scale(0.98)}
.wizard-recipe.picked{border-color:var(--accent);background:var(--accent-light)}
.wizard-recipe-info{flex:1;min-width:0}
.wizard-recipe-name{font-size:14px;font-weight:500}
.wizard-recipe-meta{font-size:11px;color:var(--muted);margin-top:2px}
.wizard-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:transparent;transition:all 0.15s}
.wizard-recipe.picked .wizard-check{border-color:var(--accent);background:var(--accent);color:#fff}
.wizard-footer{padding:16px 20px;background:var(--card);border-top:1px solid var(--border);position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center}
.wizard-footer .btn{min-width:120px;text-align:center}
.wizard-count{font-size:14px;color:var(--muted)}
.wizard-day{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.wizard-day-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.wizard-day-header .wd-date{font-size:12px;color:var(--muted);font-weight:400}
.wizard-day-meals{padding:8px 12px;min-height:40px;display:flex;flex-direction:column;gap:6px}
.wizard-day-meal{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--accent-light);border:1px solid var(--accent);border-radius:8px;font-size:13px;font-weight:500}
.wizard-day-meal .wdm-remove{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.wizard-day-meal .wdm-remove:active{color:var(--accent)}
.wizard-unassigned{margin-bottom:16px}
.wizard-unassigned-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];

}

// seeded ordering. The final mix is essential: without it, changing only the last
// character (e.g. the week digit) barely perturbs the hash, so the ordering wouldn't
// vary week to week.
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h >>> 0;
}

/* ── State management with Supabase sync ── */
let state = { selected: [], checked: {}, favorites: [], calendar: {}, customRecipes: [], mealTypes: {}, hidden: [] };

// Load from localStorage first for instant render
let localUpdatedAt = parseInt(localStorage.getItem('mealPlannerUpdatedAt') || '0', 10) || 0;
const cached = localStorage.getItem('mealPlannerState');
if (cached) {
  try {
    const parsed = JSON.parse(cached);
    state = { selected: ensureArray(parsed.selected), checked: ensureObject(parsed.checked), favorites: ensureArray(parsed.favorites), calendar: ensureObject(parsed.calendar), customRecipes: ensureArray(parsed.customRecipes), mealTypes: ensureObject(parsed.mealTypes), hidden: ensureArray(parsed.hidden) };
  } catch(e) {}
}

function ensureArray(v) { return Array.isArray(v) ? v : []; }
function ensureObject(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }

// Seed hardcoded RECIPES into customRecipes so all recipes are unified and deletable.
// Tombstoned recipes (deleted:true) keep their id present, so a deleted seed is
// never resurrected here and the deletion syncs via custom_recipes.
function seedRecipes() {
  const existingIds = new Set(state.customRecipes.map(r => r.id));
  RECIPES.forEach(r => {
    if (!existingIds.has(r.id)) state.customRecipes.push(r);
  });
}
seedRecipes();
// Drop legacy per-week "shop done" flags (feature removed — copy is the terminal act).
Object.keys(state.checked).forEach(k => { if (k.indexOf('shop-done:') === 0) delete state.checked[k]; });
persistLocal();

// Visible recipes exclude tombstones (see deleteCustomRecipe).
function getAllRecipes() { return state.customRecipes.filter(r => !r.deleted); }
// Does a checked-item key belong to this recipe? Keys are `weekKey|recipeId|itemName`.
function keyMatchesRecipe(k, id) { const p = k.split('|'); return p[0] === id || p[1] === id; }

function setSyncStatus(status) {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  el.className = 'sync-dot ' + status;
  el.title = status === 'connected' ? 'Synced' : status === 'connecting' ? 'Connecting...' : 'Offline';
}

/* ── Sync engine ──
   Local-first with last-write-wins by timestamp. Every mutation calls save(),
   which stamps localUpdatedAt, writes localStorage synchronously (never dropped),
   and schedules a debounced flush to Supabase. A single-flight flush with a dirty
   flag guarantees the latest state is always persisted — rapid edits never get
   lost. Incoming remote data (initial load or realtime) is applied only when it is
   strictly newer than our last local change, so our own echoes never revert us and
   newer offline-local edits are never clobbered by a stale server row. */
let flushInFlight = false;
let flushDirty = false;
let flushTimer = null;
let lastSyncedAt = 0;

function persistLocal() {
  try {
    localStorage.setItem('mealPlannerState', JSON.stringify(state));
    localStorage.setItem('mealPlannerUpdatedAt', String(localUpdatedAt));
  } catch(e) {}
}

// Overwrite the synced fields from a remote row, preserving device-local fields.
function applyRemote(data) {
  const localHidden = state.hidden;
  const localMealTypes = state.mealTypes;
  state.selected = ensureArray(data.selected);
  state.checked = ensureObject(data.checked);
  state.favorites = ensureArray(data.favorites);
  state.calendar = ensureObject(data.calendar);
  state.customRecipes = ensureArray(data.custom_recipes);
  state.hidden = localHidden;
  state.mealTypes = localMealTypes;
  seedRecipes();
  persistLocal();
  render();
}

function remoteMs(data) {
  const t = data && data.updated_at ? Date.parse(data.updated_at) : 0;
  return isNaN(t) ? 0 : t;
}

async function loadFromSupabase() {
  try {
    const { data, error } = await sb.from('meal_state').select('*').eq('id', 1).single();
    if (error) throw error;
    if (data) {
      const rMs = remoteMs(data);
      if (rMs > localUpdatedAt) {
        // Server is newer than anything we have locally — adopt it.
        localUpdatedAt = rMs;
        lastSyncedAt = rMs;
        applyRemote(data);
      } else if (localUpdatedAt > lastSyncedAt) {
        // We hold unsynced local changes that are newer — push them up.
        scheduleFlush();
      }
    }
    syncConnected = true;
    setSyncStatus('connected');
  } catch(e) {
    console.log('Supabase load failed, using local cache:', e.message);
    syncConnected = false;
    setSyncStatus('offline');
  }
}

function scheduleFlush() {
  if (flushTimer) return;
  flushTimer = setTimeout(function() { flushTimer = null; flushToSupabase(); }, 400);
}

async function flushToSupabase() {
  if (flushInFlight) { flushDirty = true; return; }
  flushInFlight = true;
  flushDirty = false;
  const stamp = localUpdatedAt || Date.now();
  try {
    const { error } = await sb.from('meal_state').upsert({
      id: 1,
      selected: state.selected,
      checked: state.checked,
      favorites: state.favorites,
      calendar: state.calendar,
      custom_recipes: state.customRecipes,
      updated_at: new Date(stamp).toISOString()
    });
    if (error) throw error;
    lastSyncedAt = stamp;
    syncConnected = true;
    setSyncStatus('connected');
  } catch(e) {
    console.log('Supabase save failed:', e.message);
    syncConnected = false;
    setSyncStatus('offline');
    flushDirty = true; // retry on next flush
  }
  flushInFlight = false;
  // If more edits landed (or the write failed), flush again with the latest state.
  if (flushDirty || localUpdatedAt > lastSyncedAt) { flushDirty = false; scheduleFlush(); }
}

function save() {
  localUpdatedAt = Date.now();
  persistLocal();
  scheduleFlush();
}

// Realtime subscription: apply only rows strictly newer than our local state.
sb.channel('meal_state_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'meal_state' }, (payload) => {
    const data = payload.new;
    if (!data) return;
    const rMs = remoteMs(data);
    if (rMs > localUpdatedAt) {
      localUpdatedAt = rMs;
      lastSyncedAt = rMs;
      applyRemote(data);
    }
  })
  .subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      syncConnected = true;
      setSyncStatus('connected');
    }
  });

// Initial load from Supabase
loadFromSupabase();

function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById(view + '-view');
  if (!el) view = 'home';
  document.getElementById(view + '-view').classList.add('active');
  // Two tabs: "This week" owns home + its sub-surfaces (calendar editor, list); Library is browse.
  const tabIdx = view === 'browse' ? 1 : 0;
  document.querySelectorAll('.tab')[tabIdx].classList.add('active');
  if (view === 'list') shopWeekOffset = calWeekOffset;
  render();
  window.scrollTo(0, 0); // fresh tab starts at the top
}

let toastTimer = null;
function showToast(msg, undoFn) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  if (toastTimer) clearTimeout(toastTimer);
  let html = '<div class="toast"><span>' + esc(msg) + '</span>';
  if (undoFn) html += '<button class="toast-undo" onclick="this.parentElement.remove();">Undo</button>';
  html += '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  const toastEl = document.querySelector('.toast');
  if (undoFn) {
    toastEl.querySelector('.toast-undo').onclick = function() { undoFn(); toastEl.remove(); };
  }
  toastTimer = setTimeout(() => { if (toastEl.parentElement) toastEl.remove(); }, 5000);
}

function toggleMeal(id) {
  const idx = state.selected.indexOf(id);
  if (idx === -1) {
    state.selected.push(id);
    save(); render();
  } else {
    // Snapshot for undo
    const snapSelected = [...state.selected];
    const snapChecked = {...state.checked};
    const snapCalendar = JSON.parse(JSON.stringify(state.calendar));
    const rName = (getAllRecipes().find(r=>r.id===id)||{}).name || 'Recipe';

    state.selected.splice(idx, 1);
    Object.keys(state.checked).forEach(k => {
      if (keyMatchesRecipe(k, id)) delete state.checked[k];
    });
    // Remove from today/future days only — keep past days as cooked history.
    Object.keys(state.calendar).forEach(dk => {
      if (isPast(new Date(dk + 'T12:00:00'))) return;
      state.calendar[dk] = state.calendar[dk].filter(mid => mid !== id);
      if (state.calendar[dk].length === 0) delete state.calendar[dk];
    });
    save(); render();
    showToast(rName + ' removed', function() {
      state.selected = snapSelected;
      state.checked = snapChecked;
      state.calendar = snapCalendar;
      save(); render();
    });
  }
}

function toggleFavorite(id) {
  const idx = state.favorites.indexOf(id);
  if (idx === -1) {
    state.favorites.push(id);
  } else {
    state.favorites.splice(idx, 1);
  }
  save();
  render();
}

let showHidden = false;

function hideRecipe(id) {
  if (!state.hidden.includes(id)) {
    state.hidden.push(id);
    save();
    render();
    const r = getAllRecipes().find(r => r.id === id);
    showToast((r ? r.name : 'Recipe') + ' hidden', function() {
      state.hidden = state.hidden.filter(h => h !== id);
      save(); render();
    });
  }
}

function unhideRecipe(id) {
  state.hidden = state.hidden.filter(h => h !== id);
  save(); render();
}

function toggleShowHidden() {
  showHidden = !showHidden;
  render();
}

function toggleCheck(key) {
  state.checked[key] = !state.checked[key];
  save();
  render();
}

function uncheckAll() {
  // Clear only this week's ingredient checks — leave other weeks and the
  // shopping-completed flags untouched.
  const prefix = shopWeekKey(shopWeekOffset) + '|';
  Object.keys(state.checked).forEach(k => {
    if (k.indexOf(prefix) === 0) delete state.checked[k];
  });
  save();
  render();
}

/* ── Calendar ── */
let calWeekOffset = 0;
let shopWeekOffset = 0;
let pickerDate = null;
let browseSearch = '';

function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + (offset * 7));
  mon.setHours(0,0,0,0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    dates.push(d);
  }
  return dates;
}

// Local calendar date (Y-M-D) — NOT toISOString(), which shifts by a day in
// non-US timezones and can even flip the day for US zones after UTC midnight.
function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function isToday(d) {
  const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function isPast(d) {
  const n = new Date(); n.setHours(0,0,0,0);
  const dd = new Date(d); dd.setHours(0,0,0,0);
  return dd < n;
}

function fmtDate(d) {
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()] + ' ' + d.getDate();
}

function dayName(d) {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
}

function changeWeek(dir) { calWeekOffset += dir; render(); }

function copyWeek(offset) {
  const srcDates = getWeekDates(offset);
  const dstDates = getWeekDates(offset + 1);
  srcDates.forEach((d, i) => {
    const sk = dateKey(d);
    const dk = dateKey(dstDates[i]);
    if (state.calendar[sk] && state.calendar[sk].length > 0) {
      // Dedupe so copying twice (or onto an existing plan) doesn't double meals.
      state.calendar[dk] = [...new Set([...(state.calendar[dk]||[]), ...state.calendar[sk]])];
    }
  });
  save(); render();
  showToast('Week copied to next week');
}

function clearWeek(offset) {
  const dates = getWeekDates(offset);
  dates.forEach(d => { delete state.calendar[dateKey(d)]; });
  save(); render();
  showToast('Week cleared');
}

function quickAddToDay(mealId) {
  // Ensure meal is in selected first
  if (!state.selected.includes(mealId)) {
    state.selected.push(mealId);
    save();
  }
  openInboxAssign(mealId);
}

function cycleMealType(dk, mealId) {
  const key = dk + '_' + mealId;
  const types = ['', 'breakfast', 'lunch', 'dinner'];
  const cur = state.mealTypes[key] || '';
  const idx = types.indexOf(cur);
  const next = types[(idx + 1) % types.length];
  if (next) state.mealTypes[key] = next;
  else delete state.mealTypes[key];
  save(); render();
}

function openMealPicker(dateStr) {
  pickerDate = dateStr;
  renderPicker();
}

function closePicker() {
  pickerDate = null;
  const m = document.getElementById('meal-picker-modal');
  if (m) m.remove();
}

function renderPicker() {
  if (!pickerDate) return;
  const old = document.getElementById('meal-picker-modal');
  if (old) old.remove();
  const dayMeals = state.calendar[pickerDate] || [];
  const d = new Date(pickerDate + 'T12:00:00');
  // Show approved meals first, then unapproved
  const approvedRecipes = getAllRecipes().filter(r => state.selected.includes(r.id));
  const otherRecipes = getAllRecipes().filter(r => !state.selected.includes(r.id));
  let h = '<div class="modal-overlay" id="meal-picker-modal" onclick="if(event.target===this)closePicker()">';
  h += '<div class="modal">';
  h += '<h3>Add meal to ' + dayName(d) + '</h3>';
  h += '<p class="modal-sub">' + fmtDate(d) + '</p>';
  if (approvedRecipes.length > 0) {
    approvedRecipes.forEach(r => {
      const added = dayMeals.includes(r.id);
      h += '<div class="modal-meal' + (added?' added':'') + '" ' + (added?'':'onclick="addMealToDay(\''+pickerDate+'\',\''+r.id+'\')"') + '>';
      h += '<div class="modal-meal-info"><div class="modal-meal-name">' + esc(r.name) + '</div>';
      h += '<div class="modal-meal-tags">serves ' + r.servings + (added?' · already added':'') + '</div></div>';
      if (!added) h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
      h += '</div>';
    });
  }
  if (otherRecipes.length > 0) {
    if (approvedRecipes.length > 0) h += '<div class="section-label" style="margin-top:8px">More recipes</div>';
    otherRecipes.forEach(r => {
      const added = dayMeals.includes(r.id);
      h += '<div class="modal-meal' + (added?' added':'') + '" ' + (added?'':'onclick="addMealToDayAndSelect(\''+pickerDate+'\',\''+r.id+'\')"') + '>';
      h += '<div class="modal-meal-info"><div class="modal-meal-name">' + esc(r.name) + '</div>';
      h += '<div class="modal-meal-tags">serves ' + r.servings + (added?' · already added':'') + '</div></div>';
      if (!added) h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
      h += '</div>';
    });
  }
  h += '<button class="modal-cancel" onclick="closePicker()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function addMealToDay(dateStr, mealId) {
  if (!state.calendar[dateStr]) state.calendar[dateStr] = [];
  if (!state.calendar[dateStr].includes(mealId)) state.calendar[dateStr].push(mealId);
  save();
  closePicker();
  render();
}

function addMealToDayAndSelect(dateStr, mealId) {
  if (!state.selected.includes(mealId)) state.selected.push(mealId);
  addMealToDay(dateStr, mealId);
}

function removeMealFromDay(dateStr, mealId) {
  if (!state.calendar[dateStr]) return;
  state.calendar[dateStr] = state.calendar[dateStr].filter(id => id !== mealId);
  if (state.calendar[dateStr].length === 0) delete state.calendar[dateStr];
  save();
  render();
}

function moveMealToDay(fromDate, toDate, mealId) {
  if (!toDate || fromDate === toDate) return;
  if (fromDate && state.calendar[fromDate]) {
    state.calendar[fromDate] = state.calendar[fromDate].filter(id => id !== mealId);
    if (state.calendar[fromDate].length === 0) delete state.calendar[fromDate];
  }
  if (!state.selected.includes(mealId)) state.selected.push(mealId);
  if (!state.calendar[toDate]) state.calendar[toDate] = [];
  if (!state.calendar[toDate].includes(mealId)) state.calendar[toDate].push(mealId);
  save();
  render();
}

/* ── Drag & drop: drag a recipe (by its grip handle) onto a day. Works with
   mouse and touch via Pointer Events. The tap-to-Assign buttons remain as a
   fallback. Only the grip handle has touch-action:none, so page scrolling on
   touch devices is unaffected. ── */
(function initMealDrag() {
  var THRESHOLD = 6;      // px of movement before a press becomes a drag
  var start = null, dragging = false, ghost = null, lastZone = null, suppressClick = false;

  function moveGhost(x, y) {
    if (ghost) ghost.style.transform = 'translate(' + (x + 12) + 'px,' + (y + 14) + 'px)';
  }

  function zoneAt(x, y) {
    if (ghost) ghost.style.display = 'none';
    var el = document.elementFromPoint(x, y);
    if (ghost) ghost.style.display = '';
    return el && el.closest ? el.closest('[data-drop-date]') : null;
  }

  function highlight(zone) {
    if (zone === lastZone) return;
    if (lastZone) lastZone.classList.remove('drop-target-active');
    if (zone) zone.classList.add('drop-target-active');
    lastZone = zone;
  }

  function beginDrag() {
    dragging = true;
    start.el.classList.add('dragging-source');
    ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = start.name;
    document.body.appendChild(ghost);
    moveGhost(start.x, start.y);
  }

  function cleanup() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if (ghost) { ghost.remove(); ghost = null; }
    if (lastZone) { lastZone.classList.remove('drop-target-active'); lastZone = null; }
    if (start && start.el) start.el.classList.remove('dragging-source');
    start = null; dragging = false;
  }

  function onDown(e) {
    if (e.button != null && e.button !== 0) return;   // primary button / touch only
    var handle = e.target.closest && e.target.closest('[data-drag-handle]');
    if (!handle) return;
    var item = handle.closest('[data-drag-recipe]');
    if (!item) return;
    var label = item.querySelector('.inbox-meal-name, .cal-meal-name');
    start = {
      x: e.clientX, y: e.clientY,
      recipe: item.getAttribute('data-drag-recipe'),
      from: item.getAttribute('data-drag-from') || '',
      el: item,
      name: label ? label.textContent : 'Meal'
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  function onMove(e) {
    if (!start) return;
    if (!dragging) {
      if (Math.abs(e.clientX - start.x) < THRESHOLD && Math.abs(e.clientY - start.y) < THRESHOLD) return;
      beginDrag();
    }
    e.preventDefault();
    moveGhost(e.clientX, e.clientY);
    highlight(zoneAt(e.clientX, e.clientY));
  }

  function onUp(e) {
    if (!start) { cleanup(); return; }
    if (dragging) {
      var zone = zoneAt(e.clientX, e.clientY);
      var recipe = start.recipe, from = start.from;
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 60);
      cleanup();
      if (zone) {
        var to = zone.getAttribute('data-drop-date');
        if (to && to !== from) {
          if (from) moveMealToDay(from, to, recipe);
          else addMealToDay(to, recipe);
        }
      }
      return;
    }
    cleanup();
  }

  // Swallow the synthetic click that follows a drag so it doesn't open a modal.
  document.addEventListener('click', function (e) {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  document.addEventListener('pointerdown', onDown);
})();

function openInboxAssign(mealId) {
  const r = getAllRecipes().find(r => r.id === mealId);
  if (!r) return;
  const old = document.getElementById('inbox-assign-modal');
  if (old) old.remove();
  const weekDates = getWeekDates(calWeekOffset);
  let h = '<div class="modal-overlay" id="inbox-assign-modal" onclick="if(event.target===this)closeInboxAssign()">';
  h += '<div class="modal">';
  h += '<h3>Assign ' + esc(r.name) + '</h3>';
  h += '<p class="modal-sub">Pick a day this week</p>';
  weekDates.forEach(d => {
    const dk = dateKey(d);
    const today = isToday(d);
    const existing = (state.calendar[dk]||[]).length;
    h += '<div class="modal-meal" onclick="addMealToDay(\'' + dk + '\',\'' + mealId + '\');closeInboxAssign()">';
    h += '<div class="modal-meal-info"><div class="modal-meal-name">' + dayName(d) + (today?' · Today':'') + '</div>';
    h += '<div class="modal-meal-tags">' + fmtDate(d) + (existing ? ' · ' + existing + ' meal' + (existing!==1?'s':'') : '') + '</div></div>';
    h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';

function parseQty(s) {
  if (!s || s === 'to taste') return null;
  const fracs = {'½':0.5,'⅓':0.333,'⅔':0.667,'¼':0.25,'¾':0.75,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
  let str = s.trim();
  // Handle "3 x 3 oz" pattern
  const xMatch = str.match(/^(\d+)\s*x\s*(.+)$/i);
  if (xMatch) { str = xMatch[2]; }
  const mult = xMatch ? parseInt(xMatch[1]) : 1;
  // Extract number and unit
  let num = 0;
  const m = str.match(/^(\d+)?\s*([¼-¾⅐-⅞½⅓⅔¼¾⅛⅜⅝⅞])?\s*(.*)$/);
  if (!m) return null;
  if (m[1]) num += parseInt(m[1]);
  if (m[2] && fracs[m[2]]) num += fracs[m[2]];
  if (num === 0) return null;
  num *= mult;
  const unit = m[3].trim().toLowerCase();
  return { num, unit };
}
function formatQty(num, unit) {
  const fracs = [[0.875,'⅞'],[0.75,'¾'],[0.667,'⅔'],[0.625,'⅝'],[0.5,'½'],[0.375,'⅜'],[0.333,'⅓'],[0.25,'¼'],[0.125,'⅛']];
  let whole = Math.floor(num);
  let frac = num - whole;
  let fracStr = '';
  if (frac > 0.05) {
    let best = fracs.reduce((a,b) => Math.abs(b[0]-frac) < Math.abs(a[0]-frac) ? b : a);
    if (Math.abs(best[0]-frac) < 0.1) fracStr = best[1];
    else { whole = Math.round(num); }
  }
  let s = '';
  if (whole > 0 && fracStr) s = whole + fracStr;
  else if (fracStr) s = fracStr;
  else s = '' + whole;
  return unit ? s + ' ' + unit : s;
}
// Canonicalize a unit string so aliases combine ("grams"→g) and units convert.
const UNIT_ALIASES = {
  g:'g', gram:'g', grams:'g', gr:'g',
  kg:'kg', kgs:'kg', kilogram:'kg', kilograms:'kg', kilo:'kg', kilos:'kg',
  ml:'ml', milliliter:'ml', milliliters:'ml', millilitre:'ml', millilitres:'ml',
  l:'l', liter:'l', liters:'l', litre:'l', litres:'l',
  tsp:'tsp', teaspoon:'tsp', teaspoons:'tsp',
  tbsp:'tbsp', tablespoon:'tbsp', tablespoons:'tbsp',
  cup:'cup', cups:'cup', oz:'oz', ounce:'oz', ounces:'oz',
  floz:'floz', 'fl oz':'floz', 'fluid ounce':'floz', 'fluid ounces':'floz',
  lb:'lb', lbs:'lb', pound:'lb', pounds:'lb',
  clove:'clove', cloves:'clove', can:'can', cans:'can'
};
function canonUnit(u) { u = (u || '').toLowerCase().replace(/\./g, '').trim(); return UNIT_ALIASES[u] || u; }

// Imperial output. Metric mass/volume are converted to oz/lb and cups/fl oz/tbsp;
// cooking units the recipe already wrote in imperial (cup, tbsp, tsp) are kept.
const MASS_TO_OZ = { g:0.03527396, kg:35.27396, oz:1, lb:16 };
const VOL_TO_FLOZ = { ml:0.03381402, l:33.81402, floz:1, cup:8, tbsp:0.5, tsp:0.1666667 };

function formatMassImperial(oz) {
  return Math.round(oz) >= 16 ? formatQty(oz / 16, 'lb') : formatQty(Math.round(oz), 'oz');
}
function formatVolImperial(floz) {
  if (floz >= 7.5) return formatQty(floz / 8, 'cups');
  if (floz >= 1)   return formatQty(floz, 'fl oz');
  const tbsp = floz * 2;
  if (tbsp >= 0.75) return formatQty(Math.round(tbsp), 'tbsp');
  return formatQty(Math.max(1, Math.round(floz * 6)), 'tsp');
}

// Convert a single quantity string to imperial. Metric mass/volume convert;
// oz/lb are tidied (16 oz → 1 lb); other units/strings pass through unchanged.
function toImperialQty(str) {
  const p = parseQty(str);
  if (!p) return str;
  const u = canonUnit(p.unit);
  if (MASS_TO_OZ[u]) return formatMassImperial(p.num * MASS_TO_OZ[u]);
  if (u === 'ml' || u === 'l') return formatVolImperial(p.num * VOL_TO_FLOZ[u]);
  return str;
}

// Combine two parsed quantities into imperial, converting across compatible
// units. Returns a formatted string, or null if they can't be combined.
function combineParsed(a, b) {
  const ua = canonUnit(a.unit), ub = canonUnit(b.unit);
  if (MASS_TO_OZ[ua] && MASS_TO_OZ[ub]) {
    return formatMassImperial(a.num * MASS_TO_OZ[ua] + b.num * MASS_TO_OZ[ub]);
  }
  if (VOL_TO_FLOZ[ua] && VOL_TO_FLOZ[ub]) {
    // Keep a shared imperial cooking unit (tbsp+tbsp → tbsp); otherwise normalize.
    if (ua === ub && (ua === 'cup' || ua === 'tbsp' || ua === 'tsp')) {
      return formatQty(a.num + b.num, ua === 'cup' ? 'cups' : ua);
    }
    return formatVolImperial(a.num * VOL_TO_FLOZ[ua] + b.num * VOL_TO_FLOZ[ub]);
  }
  if (ua === ub) return formatQty(a.num + b.num, ua);
  return null;
}
function smartCombineQty(q1, q2) {
  const a = parseQty(q1), b = parseQty(q2);
  if (!a || !b) {
    // Non-numeric (e.g. "to taste"): collapse duplicates instead of concatenating.
    const s1 = (q1 || '').trim(), s2 = (q2 || '').trim();
    if (!s1) return s2;
    if (!s2) return s1;
    if (s1.toLowerCase() === s2.toLowerCase()) return s1;
    return s1 + ' + ' + s2;
  }
  const combined = combineParsed(a, b);
  if (combined) return combined;
  if (q1 === q2) return '2× ' + q1;
  return q1 + ' + ' + q2;
}

// Normalize an ingredient name for de-duplication: drop parenthetical/footnote
// notes and trailing prep clauses, keeping the identifying words. So "Boneless,
// skinless chicken thighs (see note 1)" and "... (note 1)" merge into one line.
function normIngredientName(name) {
  return cleanItemNameForCopy(name)
    .toLowerCase()
    .replace(/\([^)]*\)/g, ' ')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function getShoppingList(mealIds, weekKey) {
  const catOrder = ['Meat','Produce','Dairy','Pantry','Spices','Noodles & Pasta'];
  const groups = {};
  const ids = mealIds || state.selected;
  const wk = weekKey || '';

  ids.forEach(id => {
    const r = getAllRecipes().find(r => r.id === id);
    if (!r) return;
    (r.ingredients || []).forEach(g => {
      if (!groups[g.cat]) groups[g.cat] = [];
      g.items.forEach(item => {
        groups[g.cat].push({
          name: item.name,
          qty: item.qty,
          meal: r.name,
          mealId: r.id,
          // Week-scoped so checking an item off doesn't pre-check it in other weeks.
          key: wk + '|' + r.id + '|' + item.name
        });
      });
    });
  });

  const consolidated = {};
  Object.keys(groups).forEach(cat => {
    consolidated[cat] = [];
    const seen = {};
    groups[cat].forEach(item => {
      const normName = normIngredientName(item.name);
      if (seen[normName]) {
        seen[normName].meals.push(item.meal);
        seen[normName].keys.push(item.key);
        seen[normName].qty = smartCombineQty(seen[normName].qty, item.qty);
      } else {
        const entry = {name: item.name, qty: item.qty, meals:[item.meal], keys:[item.key]};
        seen[normName] = entry;
        consolidated[cat].push(entry);
      }
    });
  });

  // Display every quantity in imperial (single items that were never combined
  // are still metric here; combined ones are already imperial and pass through).
  Object.keys(consolidated).forEach(cat => {
    consolidated[cat].forEach(entry => { entry.qty = toImperialQty(entry.qty); });
  });

  const sorted = [];
  catOrder.forEach(cat => {
    if (consolidated[cat]) sorted.push({cat, items: consolidated[cat]});
  });
  Object.keys(consolidated).forEach(cat => {
    if (!catOrder.includes(cat)) sorted.push({cat, items: consolidated[cat]});
  });
  return sorted;
}
