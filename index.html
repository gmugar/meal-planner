        calHTML += '<button class="cal-meal-remove" onclick="removeMealFromDay(\'' + dk + '\',\'' + r.id + '\')">&times;</button></div>';
      });
      if (!past) calHTML += '<button class="btn-add-meal" onclick="openMealPicker(\'' + dk + '\')">+ Add meal</button>';
      calHTML += '</div></div>';
    });
  }
  calEl.innerHTML = calHTML;

  // Shopping list view — filtered by week
  const shopDates = getWeekDates(shopWeekOffset);
  const shopWk = shopWeekKey(shopWeekOffset);
  const shopMealIds = getMealOccurrences(shopWeekOffset);
  const shopList = getShoppingList(shopMealIds, shopWk);
  // Recipes planned this week that have no ingredients yet (e.g. link-only inbox adds).
  const noIngRecipes = [...new Set(shopMealIds)]
    .map(id => getAllRecipes().find(r => r.id === id))
    .filter(r => r && (!r.ingredients || r.ingredients.reduce((s,g)=>s+g.items.length,0) === 0));
  const shopWeekLabel = fmtDate(shopDates[0]) + ' — ' + fmtDate(shopDates[6]);
  const shopIsThisWeek = shopWeekOffset === 0;

  let shopHeader = '<a href="#" class="view-back" onclick="showView(\'home\');return false">&larr; This week</a>';
  shopHeader += '<div class="cal-header">';
  shopHeader += '<button class="cal-nav-btn" onclick="changeShopWeek(-1)">&larr;</button>';
  shopHeader += '<h2>' + shopWeekLabel + (shopIsThisWeek ? ' · This week' : '') + '</h2>';
  shopHeader += '<button class="cal-nav-btn" onclick="changeShopWeek(1)">&rarr;</button>';
  shopHeader += '</div>';

  if (shopMealIds.length === 0) {
    listEl.innerHTML = shopHeader + '<div class="empty"><div class="icon">&#128722;</div><p>No meals planned for this week.<br>Plan the week first, then your list appears here.</p><button class="empty-cta" onclick="openWeekPicker()">Plan this week</button></div>';
  } else {
    // "Checked" means: I already have this at home — leave it off the order.
    let totalItems = 0;
    let haveItems = 0;
    shopList.forEach(g => g.items.forEach(item => {
      totalItems++;
      if (item.keys.every(k => state.checked[k])) haveItems++;
    }));
    const toOrder = totalItems - haveItems;

    let html = shopHeader;
    html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)">';
    html += '<div style="font-family:var(--font-display);font-size:17px;font-weight:800">' + toOrder + ' item' + (toOrder!==1?'s':'') + ' to order</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">Tick anything you already have &mdash; Copy sends the rest' + (haveItems > 0 ? ' &middot; ' + haveItems + ' marked have' : '') + '</div>';
    html += '</div>';
    html += '<div class="list-actions">';
    html += '<button class="btn btn-add" id="copy-list-btn" style="flex:1;padding:12px" onclick="copyShoppingList()">&#128203; Copy ' + toOrder + ' item' + (toOrder!==1?'s':'') + '</button>';
    if (haveItems > 0) html += '<button class="btn-outline" onclick="uncheckAll()">Clear haves</button>';
    html += '</div>';

    if (noIngRecipes.length > 0) {
      html += '<div class="shop-warning" style="background:var(--yolk-light);border:1px solid var(--yolk);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--text)">';
      html += '&#9888;&#65039; ' + noIngRecipes.length + ' recipe' + (noIngRecipes.length!==1?'s':'') + ' ' + (noIngRecipes.length!==1?'have':'has') + ' no ingredients yet, so ' + (noIngRecipes.length!==1?'they\'re':'it\'s') + ' not in the list: ';
      html += noIngRecipes.map(r => '<a href="#" onclick="openIngredientEditor(\'' + r.id + '\');return false" style="color:var(--tomato);font-weight:600;text-decoration:none">' + esc(r.name) + '</a>').join(', ');
      html += '</div>';
    }

    shopList.forEach(group => {
      html += '<div class="section-label">' + esc(group.cat) + '</div>';
      group.items.forEach(item => {
        const isHave = item.keys.every(k => state.checked[k]);
        html += '<div class="shop-item' + (isHave ? ' checked' : '') + '">';
        html += '<input type="checkbox" ' + (isHave ? 'checked ' : '') + 'data-keys="' + esc(JSON.stringify([...new Set(item.keys)])) + '" onchange="toggleCheckFromEl(this)" title="Tick = already have it">';
        html += '<div class="item-details">';
        html += '<div class="item-name">' + esc(item.name) + (isHave ? ' <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">have</span>' : '') + '</div>';
        html += '<div class="item-qty">' + esc(item.qty) + '</div>';
        html += '<div class="item-meals">';
        const uniqueMeals = [...new Set(item.meals)];
        uniqueMeals.forEach(m => {
          html += '<span class="meal-dot">' + esc(m.split(' ').slice(0,3).join(' ')) + '</span>';
        });
        html += '</div></div></div>';
      });
    });
    listEl.innerHTML = html;
  }

  // Keep the viewport where the user left it after an in-place re-render.
  window.scrollTo(0, scrollY);
}

// Toggle a shop item whose keys are carried on the element (robust to quotes in
// ingredient names, which broke the old inline-args approach).
function toggleCheckFromEl(el) {
  let keys = [];
  try { keys = JSON.parse(el.getAttribute('data-keys')) || []; } catch(e) {}
  const allChecked = keys.every(k => state.checked[k]);
  keys.forEach(k => state.checked[k] = !allChecked);
  save();
  render();
}

function getCardBorderClass(r) {
  if (r.tags.includes('one-pan')) return 'tag-border-onepan';
  if (r.tags.includes('one-pot')) return 'tag-border-onepot';
  if (r.tags.includes('fakeaway')) return 'tag-border-fakeaway';
  if (r.tags.includes('dairy-free')) return 'tag-border-df';
  if (r.tags.includes('gluten-free')) return 'tag-border-gf';
  return '';
}

function renderCard(r, isSelected, isHiddenCard) {
  const isFav = state.favorites.includes(r.id);
  const bc = getCardBorderClass(r);
  let html = '<div class="card ' + bc + (isHiddenCard ? ' hidden-card' : '') + '">';
  html += '<div class="card-header"><div class="card-title-row"><div>';
  html += '<h3 onclick="openRecipeDetail(\'' + r.id + '\')">' + esc(r.name) + '</h3>';
  html += '<div class="tags">';
  r.tags.forEach(t => {
    if (t==='dairy-free') html += '<span class="tag tag-df">DF</span>';
    else if (t==='gluten-free') html += '<span class="tag tag-gf">GF</span>';
    else if (t.startsWith('one-')) html += '<span class="tag tag-one">' + t + '</span>';
    else if (t==='fakeaway') html += '<span class="tag tag-one">fakeaway</span>';
  });
  html += '<span class="tag" style="background:var(--bg);color:var(--muted);border:1px solid var(--border)">serves ' + r.servings + '</span>';
  html += '</div>';
  if (r.desc) html += '<div class="card-desc">' + esc(r.desc) + '</div>';
  html += '</div></div>';
  html += '<div class="card-actions">';
  if (isHiddenCard) {
    html += '<button class="btn btn-add btn-sm" onclick="unhideRecipe(\'' + r.id + '\')">Unhide</button>';
  } else {
    html += '<button class="btn-star' + (isFav ? ' starred' : '') + '" onclick="toggleFavorite(\'' + r.id + '\')" aria-label="' + (isFav ? 'Remove from favorites' : 'Add to favorites') + '">' + (isFav ? '&#9733;' : '&#9734;') + '</button>';
    html += '<button class="btn-cal-quick" onclick="event.stopPropagation();quickAddToDay(\'' + r.id + '\')" title="Add to a day" aria-label="Add to a day">&#128197;</button>';
    html += '<button class="btn-hide" onclick="event.stopPropagation();hideRecipe(\'' + r.id + '\')" title="Hide recipe">&#10005;</button>';
    if (isSelected) {
      html += '<button class="btn btn-remove btn-sm" onclick="toggleMeal(\'' + r.id + '\')">Remove</button>';
    } else {
      html += '<button class="btn btn-add btn-sm" onclick="toggleMeal(\'' + r.id + '\')">Add</button>';
    }
  }
  html += '</div></div>';
  html += '</div>';
  return html;
}

/* ── Weekly planning wizard ── */
let wizardWeekOffset = 1;
let wizardPicked = [];

function getWeekKey(d) {
  const mon = new Date(d);
  mon.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
  mon.setHours(0, 0, 0, 0);
  return dateKey(mon);
}

// Saturday notification
function checkSaturdayNotification() {
  const now = new Date();
  if (now.getDay() !== 6) return;
  const wk = 'planDismissed_' + getWeekKey(now);
  if (localStorage.getItem(wk)) return;
  const el = document.getElementById('plan-notification');
  el.innerHTML = '<div class="plan-notify">' +
    '<div class="plan-icon">&#128203;</div>' +
    '<div class="plan-text"><div class="plan-title">Ready to plan next week?</div>' +
    '<div class="plan-sub">Pick recipes and assign them to days</div></div>' +
    '<div class="plan-actions">' +
    '<button class="plan-go" onclick="dismissPlanNotify();openWeekPicker()">Let\'s plan</button>' +
    '<button class="plan-later" onclick="dismissPlanNotify()">Later</button>' +
    '</div></div>';
}

function dismissPlanNotify() {
  const wk = 'planDismissed_' + getWeekKey(new Date());
  localStorage.setItem(wk, '1');
  document.getElementById('plan-notification').innerHTML = '';
}

// Week picker modal
function openWeekPicker() {
  const old = document.getElementById('week-picker-modal');
  if (old) old.remove();
  let h = '<div class="modal-overlay" id="week-picker-modal" onclick="if(event.target===this)closeWeekPicker()">';
  h += '<div class="modal">';
  h += '<h3>Plan which week?</h3>';
  h += '<p class="modal-sub">Choose the week you want to plan meals for</p>';
  const weekLabels = ['This week','Next week','In 2 weeks','In 3 weeks','In 4 weeks'];
  for (let i = 0; i <= 4; i++) {
    const dates = getWeekDates(i);
    const mon = dates[0]; const sun = dates[6];
    const label = weekLabels[i];
    const existingMeals = dates.reduce((c,d) => c + (state.calendar[dateKey(d)]||[]).length, 0);
    h += '<div class="week-option" onclick="selectWeekAndPlan('+i+')">';
    h += '<div class="week-option-info"><div class="week-option-label">' + label + '</div>';
    h += '<div class="week-option-dates">' + fmtDate(mon) + ' — ' + fmtDate(sun);
    if (existingMeals > 0) h += ' · ' + existingMeals + ' meal' + (existingMeals!==1?'s':'') + ' planned';
    h += '</div></div>';
    h += '<span class="week-option-arrow">&#8250;</span>';
    h += '</div>';
  }
  h += '<button class="modal-cancel" onclick="closeWeekPicker()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function closeWeekPicker() {
  const m = document.getElementById('week-picker-modal');
  if (m) m.remove();
}

function selectWeekAndPlan(offset) {
  wizardWeekOffset = offset;
  wizardPicked = [...state.selected];
  closeWeekPicker();
  renderWizard();
}

// Planning wizard
let wizardStep = 1;
let wizardSearch = '';

function renderWizard() {
  wizardStep = 1;
  const old = document.getElementById('planning-wizard');
  const prevScroll = old ? old.scrollTop : 0; // keep place across the rebuild
  const prevHeight = old ? old.scrollHeight : 0;
  if (old) old.remove();
  const dates = getWeekDates(wizardWeekOffset);
  const weekLabel = fmtDate(dates[0]) + ' — ' + fmtDate(dates[6]);

  // Most recent past cook date per recipe → "last cooked 2w ago" hints.
  const lastCooked = {};
  const today0 = new Date(); today0.setHours(0,0,0,0);
  Object.keys(state.calendar).forEach(dk => {
    const d = new Date(dk + 'T12:00:00');
    if (d >= today0) return;
    (state.calendar[dk]||[]).forEach(id => {
      if (!lastCooked[id] || d > lastCooked[id]) lastCooked[id] = d;
    });
  });
  const weeksAgo = d => Math.max(1, Math.round((today0 - d) / (7 * 24 * 3600 * 1000)));

  let h = '<div class="wizard-overlay" id="planning-wizard">';
  h += '<div class="wizard-header"><h2>Plan: ' + weekLabel + '</h2>';
  h += '<button class="wizard-close" onclick="closeWizard()">&times;</button></div>';
  h += '<div class="wizard-body">';
  h += '<div class="wizard-step">Step 1 of 3 &middot; Gather</div>';
  h += '<p class="wizard-hint">Pull from your library, or go find something new on your sites.</p>';
  h += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-outline" onclick="openImportModal()">+ Add recipe from URL</button></div>';

  // The basket — what's picked for this week so far
  if (wizardPicked.length > 0) {
    h += '<div style="background:var(--accent-light);border-radius:12px;padding:10px 12px;margin-bottom:12px">';
    h += '<div style="font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--accent-text);margin-bottom:6px">In the basket &middot; ' + wizardPicked.length + '</div>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
    wizardPicked.forEach(id => {
      const r = getAllRecipes().find(x => x.id === id);
      if (!r) return;
      h += '<span style="font-size:12px;padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer" onclick="toggleWizardPick(\'' + id + '\')" title="Remove from basket">' + esc(r.name) + ' &times;</span>';
    });
    h += '</div></div>';
  }

  // Library — favorites first, searchable, one tap to pick
  h += '<div class="section-label" style="padding-top:4px">From your library</div>';
  h += '<div class="search-wrap" style="margin:6px 0 8px"><span class="search-icon">&#128269;</span><input class="search-input" type="text" placeholder="Search your recipes..." value="' + esc(wizardSearch) + '" oninput="filterWizardList(this.value)"></div>';

  const favRecipes = getAllRecipes().filter(r => state.favorites.includes(r.id));
  const otherRecipes = getAllRecipes().filter(r => !state.favorites.includes(r.id));
  const ordered = [...favRecipes, ...otherRecipes];

  ordered.forEach(r => {
    const isPicked = wizardPicked.includes(r.id);
    const isFav = state.favorites.includes(r.id);
    const lc = lastCooked[r.id];
    h += '<div class="wizard-recipe' + (isPicked ? ' picked' : '') + '" data-name="' + esc(r.name.toLowerCase()) + '" onclick="toggleWizardPick(\'' + r.id + '\')">';
    h += '<div class="wizard-recipe-info"><div class="wizard-recipe-name">' + (isFav ? '&#9733; ' : '') + esc(r.name) + '</div>';
    h += '<div class="wizard-recipe-meta">' + (lc ? 'last cooked ' + weeksAgo(lc) + 'w ago &middot; ' : '') + 'serves ' + esc(r.servings) + '</div></div>';
    h += '<div class="wizard-check">' + (isPicked ? '&#10003;' : '') + '</div>';
    h += '</div>';
  });

  // Discovery — your source sites (with your notes) + the URL importer
  h += '<div class="section-label" style="padding-top:16px">Or find something new</div>';
  recipeSources.filter(s => s.active !== false).forEach(s => {
    h += '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;text-decoration:none;color:var(--text);background:var(--card)">';
    h += '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">' + esc(s.name) + '</div>';
    if (s.notes) h += '<div style="font-size:12px;color:var(--muted)">' + esc(s.notes) + '</div>';
    h += '</div><span style="color:var(--tomato);font-size:16px">&#8599;</span></a>';
  });
  h += '<button class="btn-outline" style="width:100%" onclick="openImportModal()">&#128279; Found one? Paste the recipe URL&hellip;</button>';

  h += '</div>';
  h += '<div class="wizard-footer">';
  h += '<div class="wizard-count">' + wizardPicked.length + ' meal' + (wizardPicked.length!==1?'s':'') + ' in the basket</div>';
  if (wizardPicked.length > 0) {
    h += '<button class="btn btn-add" onclick="wizardContinue()">Next: Assign days &#8250;</button>';
  } else {
    h += '<button class="btn btn-add" style="opacity:0.4;cursor:default">Next: Assign days &#8250;</button>';
  }
  h += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', h);
  if (wizardSearch) filterWizardList(wizardSearch);
  // Compensate for the basket appearing/growing above the list: the only height
  // change in Gather is above the scroll position, so shift by the height delta
  // to keep the library rows visually anchored.
  const nw = document.getElementById('planning-wizard');
  nw.scrollTop = Math.max(0, prevScroll + (nw.scrollHeight - prevHeight));
}

// Hide non-matching library rows in place (no re-render, keeps typing focus).
function filterWizardList(q) {
  wizardSearch = q || '';
  const needle = wizardSearch.toLowerCase();
  document.querySelectorAll('#planning-wizard .wizard-recipe').forEach(el => {
    el.style.display = (el.dataset.name || '').includes(needle) ? '' : 'none';
  });
}

function toggleWizardPick(id) {
  const idx = wizardPicked.indexOf(id);
  if (idx === -1) wizardPicked.push(id);
  else wizardPicked.splice(idx, 1);
  renderWizard();
}

function closeWizard() {
  const el = document.getElementById('planning-wizard');
  if (el) el.remove();
}

let wizardAssignments = {}; // { dateKey: [mealId, ...] }

function wizardContinue() {
  if (wizardPicked.length === 0) return;
  // Initialize assignments from existing calendar for this week
  const dates = getWeekDates(wizardWeekOffset);
  wizardAssignments = {};
  dates.forEach(d => {
    const dk = dateKey(d);
    wizardAssignments[dk] = [...(state.calendar[dk] || [])];
  });
  renderWizardStep2();
}

function renderWizardStep2() {
  wizardStep = 2;
  const old = document.getElementById('planning-wizard');
  const prevScroll = old ? old.scrollTop : 0; // keep place across the rebuild
  const prevHeight = old ? old.scrollHeight : 0;
  if (old) old.remove();
  const dates = getWeekDates(wizardWeekOffset);
  const weekLabel = fmtDate(dates[0]) + ' — ' + fmtDate(dates[6]);

  // Find unassigned meals from wizard picks
  const assignedIds = new Set();
  Object.values(wizardAssignments).forEach(ids => ids.forEach(id => assignedIds.add(id)));
  const unassigned = wizardPicked.filter(id => !assignedIds.has(id));

  let h = '<div class="wizard-overlay" id="planning-wizard">';
  h += '<div class="wizard-header"><h2>Plan: ' + weekLabel + '</h2>';
  h += '<button class="wizard-close" onclick="closeWizard()">&times;</button></div>';
  h += '<div class="wizard-body">';
  h += '<div class="wizard-step">Step 2 of 3 &middot; Assign to days</div>';
  h += '<p class="wizard-hint">Tap an unassigned meal, then tap a day to place it. Or tap + on any day.</p>';

  // Unassigned chips
  if (unassigned.length > 0) {
    h += '<div class="wizard-unassigned">';
    h += '<div class="wizard-unassigned-label">' + unassigned.length + ' to assign</div>';
    unassigned.forEach(id => {
      const r = getAllRecipes().find(r => r.id === id);
      if (!r) return;
      h += '<span class="wizard-ua-chip" onclick="wizardQuickAssign(\'' + id + '\')">' + esc(r.name) + '</span>';
    });
    h += '</div>';
  }

  // Day rows
  dates.forEach(d => {
    const dk = dateKey(d);
    const today = isToday(d);
    const meals = (wizardAssignments[dk] || []).map(id => getAllRecipes().find(r => r.id === id)).filter(Boolean);
    h += '<div class="wizard-day">';
    h += '<div class="wizard-day-header"><span>' + dayName(d) + (today ? ' · Today' : '') + '</span><span class="wd-date">' + fmtDate(d) + '</span></div>';
    h += '<div class="wizard-day-meals">';
    meals.forEach(r => {
      h += '<div class="wizard-day-meal"><span>' + esc(r.name) + '</span>';
      h += '<button class="wdm-remove" onclick="wizardUnassign(\'' + dk + '\',\'' + r.id + '\')">&times;</button></div>';
    });
    h += '<button class="btn-add-meal" onclick="wizardPickForDay(\'' + dk + '\')">+ Add meal</button>';
    h += '</div></div>';
  });

  h += '</div>';
  h += '<div class="wizard-footer">';
  h += '<button class="btn btn-remove" onclick="wizardBackToStep1()">&#8249; Back</button>';
  const totalAssigned = Object.values(wizardAssignments).reduce((s, a) => s + a.length, 0);
  h += '<div class="wizard-count">' + totalAssigned + ' meal' + (totalAssigned !== 1 ? 's' : '') + ' assigned</div>';
  h += '<button class="btn btn-add" onclick="wizardFinish()">Next: Review list &#8250;</button>';
  h += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', h);
  document.getElementById('planning-wizard').scrollTop = prevScroll;
}

function wizardBackToStep1() {
  closeWizard();
  renderWizard();
}

function wizardQuickAssign(mealId) {
  // Show a mini day picker for this meal
  const old = document.getElementById('wizard-daypick-modal');
  if (old) old.remove();
  const dates = getWeekDates(wizardWeekOffset);
  const r = getAllRecipes().find(r => r.id === mealId);
  if (!r) return;
  let h = '<div class="modal-overlay" id="wizard-daypick-modal" onclick="if(event.target===this)this.remove()">';
  h += '<div class="modal">';
  h += '<h3>Assign ' + esc(r.name) + '</h3>';
  h += '<p class="modal-sub">Pick a day</p>';
  dates.forEach(d => {
    const dk = dateKey(d);
    const today = isToday(d);
    const existing = (wizardAssignments[dk] || []).length;
    h += '<div class="modal-meal" onclick="wizardAssignToDay(\'' + dk + '\',\'' + mealId + '\')">';
    h += '<div class="modal-meal-info"><div class="modal-meal-name">' + dayName(d) + (today ? ' · Today' : '') + '</div>';
    h += '<div class="modal-meal-tags">' + fmtDate(d) + (existing ? ' · ' + existing + ' meal' + (existing !== 1 ? 's' : '') : '') + '</div></div>';
    h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
    h += '</div>';
  });
  h += '<button class="modal-cancel" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function wizardAssignToDay(dk, mealId) {
  if (!wizardAssignments[dk]) wizardAssignments[dk] = [];
  if (!wizardAssignments[dk].includes(mealId)) wizardAssignments[dk].push(mealId);
  const modal = document.getElementById('wizard-daypick-modal');
  if (modal) modal.remove();
  renderWizardStep2();
}

function wizardUnassign(dk, mealId) {
  if (!wizardAssignments[dk]) return;
  wizardAssignments[dk] = wizardAssignments[dk].filter(id => id !== mealId);
  renderWizardStep2();
}

function wizardPickForDay(dk) {
  // Show recipe picker for a specific day
  const old = document.getElementById('wizard-daypick-modal');
  if (old) old.remove();
  const d = new Date(dk + 'T12:00:00');
  const dayMeals = wizardAssignments[dk] || [];
  let h = '<div class="modal-overlay" id="wizard-daypick-modal" onclick="if(event.target===this)this.remove()">';
  h += '<div class="modal">';
  h += '<h3>Add meal to ' + dayName(d) + '</h3>';
  h += '<p class="modal-sub">' + fmtDate(d) + '</p>';
  wizardPicked.forEach(id => {
    const r = getAllRecipes().find(r => r.id === id);
    if (!r) return;
    const added = dayMeals.includes(id);
    h += '<div class="modal-meal' + (added ? ' added' : '') + '" ' + (added ? '' : 'onclick="wizardAssignToDay(\'' + dk + '\',\'' + id + '\')"') + '>';
    h += '<div class="modal-meal-info"><div class="modal-meal-name">' + r.name + '</div>';
    h += '<div class="modal-meal-tags">serves ' + r.servings + (added ? ' · already added' : '') + '</div></div>';
    if (!added) h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
    h += '</div>';
  });
  h += '<button class="modal-cancel" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function wizardFinish() {
  // Merge wizard picks into state.selected
  wizardPicked.forEach(id => {
    if (!state.selected.includes(id)) state.selected.push(id);
  });
  // Apply assignments to calendar. The wizard represents the full intended plan
  // for this week, so emptied days must be cleared — not left with stale meals.
  const dates = getWeekDates(wizardWeekOffset);
  dates.forEach(d => {
    const dk = dateKey(d);
    const a = wizardAssignments[dk] || [];
    if (a.length > 0) state.calendar[dk] = a.slice();
    else delete state.calendar[dk];
  });
  save();
  closeWizard();
  // Step 3 of the ritual: review the generated list, tick what you have, copy.
  calWeekOffset = wizardWeekOffset;
  shopWeekOffset = wizardWeekOffset;
  showView('list');
  showToast('Step 3: tick what you already have, then copy the list');
}

/* ── Recipe import from URL ── */
function openImportModal() {
  const old = document.getElementById('import-modal');
  if (old) old.remove();
  let h = '<div class="modal-overlay" id="import-modal" onclick="if(event.target===this)closeImportModal()">';
  h += '<div class="modal" style="max-height:85vh">';
  h += '<h3>Add Recipe from URL</h3>';
  h += '<p class="modal-sub">Paste a recipe URL and we\'ll extract the ingredients</p>';
  h += '<input class="import-input" id="import-url" type="url" placeholder="https://example.com/recipe/..." autofocus>';
  h += '<div class="import-status" id="import-status"></div>';
  h += '<div id="import-preview-area"></div>';
  h += '<div class="import-actions">';
  h += '<button class="modal-cancel" onclick="closeImportModal()" style="width:auto;margin:0">Cancel</button>';
  h += '<button class="btn-import" id="import-btn" onclick="doImport()">Import Recipe</button>';
  h += '</div>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  document.getElementById('import-url').addEventListener('keydown', e => { if (e.key==='Enter') doImport(); });
}

function closeImportModal() {
  const m = document.getElementById('import-modal');
  if (m) m.remove();
}

async function doImport() {
  const urlInput = document.getElementById('import-url');
  const statusEl = document.getElementById('import-status');
  const previewEl = document.getElementById('import-preview-area');
  const btn = document.getElementById('import-btn');
  const url = urlInput.value.trim();
  if (!url) { statusEl.className='import-status error'; statusEl.textContent='Please enter a URL'; return; }

  btn.disabled = true;
  statusEl.className='import-status';
  statusEl.innerHTML='<span class="spinner"></span>Fetching recipe...';
  previewEl.innerHTML='';

  try {
    const html = await fetchHtmlViaProxies(url);
    if (!html) throw new Error('Could not fetch page. The site may be blocking access.');

    const recipe = parseRecipeFromHtml(html, url);
    if (!recipe) throw new Error('No recipe data found on this page. Try a recipe page with structured data.');

    statusEl.innerHTML='&#10003; Recipe found!';
    statusEl.className='import-status';
    showImportPreview(recipe, previewEl);
    btn.textContent='Add to Meal Planner';
    btn.disabled=false;
    btn.onclick = function() { confirmImport(recipe); };
  } catch(e) {
    statusEl.className='import-status error';
    statusEl.textContent='Error: ' + e.message;
    btn.disabled=false;
    btn.textContent='Import Recipe';
    btn.onclick=doImport;
  }
}

// Fetch a page's HTML through CORS proxies. Returns the HTML string or null.
async function fetchHtmlViaProxies(url) {
  const proxies = [
    { url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(url), json: true, field: 'contents' },
    { url: 'https://corsproxy.io/?' + encodeURIComponent(url), json: false },
    { url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), json: false }
  ];
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy.url);
      if (!res.ok) continue;
      let html = proxy.json ? (await res.json())[proxy.field] : await res.text();
      if (html && html.length > 500) return html;
    } catch(e) { continue; }
  }
  return null;
}

// Split a raw ingredient line into { qty, name } by matching a leading amount+unit.
function splitQtyName(raw) {
  const ing = String(raw).replace(/<[^>]*>/g, '').trim();
  const match = ing.match(/^([\d¼½¾⅓⅔⅛\s\/\.\-]+(?:\s*(?:cup|cups|tbsp|tsp|oz|lb|lbs|pound|pounds|g|kg|ml|L|clove|cloves|can|cans|bunch|head|large|medium|small|pinch|dash|to taste|tablespoon|tablespoons|teaspoon|teaspoons|ounce|ounces|slice|slices|piece|pieces)s?)?)\s+(.+)/i);
  if (match) return { name: match[2].trim(), qty: match[1].trim() };
  return { name: ing, qty: '' };
}

// Parse a textarea of ingredient lines (one per line) into categorized groups.
function parseIngredientLines(text) {
  const items = String(text).split('\n').map(l => l.trim()).filter(Boolean).map(splitQtyName);
  return items.length ? autoCategorize(items) : [];
}

function autoCategorize(items) {
  const rules = {
    'Meat': /\b(chicken|beef|pork|lamb|turkey|bacon|sausage|steak|ground|mince|ham|prosciutto|salami|pepperoni|shrimp|prawns|salmon|tuna|fish|cod|tilapia|crab|lobster|scallop|meatball|chorizo|duck|veal|brisket|ribs)\b/i,
    'Produce': /\b(garlic|onion|tomato|lettuce|spinach|kale|carrot|celery|pepper|potato|sweet potato|broccoli|cauliflower|zucchini|squash|cucumber|avocado|mushroom|corn|pea|bean sprout|bok choy|cabbage|ginger|lemon|lime|orange|apple|banana|berry|basil|cilantro|parsley|mint|dill|thyme|rosemary|scallion|shallot|jalapen|chili|chilli|arugula|radish|beet|asparagus|eggplant|artichoke|leek|fennel|watercress|endive|turnip|pickl)\b/i,
    'Dairy': /\b(cheese|milk|cream|butter|yogurt|sour cream|mozzarella|parmesan|cheddar|feta|ricotta|gouda|brie|egg|eggs|whipping|half.and.half|crème|mascarpone)\b/i,
    'Pantry': /\b(oil|olive oil|vinegar|soy sauce|tamari|ketchup|mustard|mayo|mayonnaise|honey|sugar|flour|bread|tortilla|wrap|rice|pasta|noodle|broth|stock|sauce|sriracha|hot sauce|worcestershire|fish sauce|hoisin|teriyaki|peanut butter|jam|maple|molasses|cornstarch|baking|yeast|cocoa|chocolate|coconut milk|tomato paste|passata|can|canned|dried|bean|lentil|chickpea)\b/i,
    'Spices': /\b(salt|pepper|paprika|cumin|oregano|cinnamon|nutmeg|cayenne|chili powder|garlic powder|onion powder|turmeric|coriander|cardamom|clove|bay leaf|bay leaves|italian seasoning|taco seasoning|curry|garam masala|red pepper flake|sesame seed|poppy|vanilla|extract)\b/i
  };
  const cats = {};
  const uncategorized = [];
  items.forEach(item => {
    let matched = false;
    for (const [cat, regex] of Object.entries(rules)) {
      if (regex.test(item.name)) {
        if (!cats[cat]) cats[cat] = [];
        cats[cat].push(item);
        matched = true;
        break;
      }
    }
    if (!matched) uncategorized.push(item);
  });
  const result = [];
  const order = ['Meat','Produce','Dairy','Pantry','Spices'];
  order.forEach(cat => { if (cats[cat]) result.push({cat, items: cats[cat]}); });
  if (uncategorized.length > 0) result.push({cat: 'Other', items: uncategorized});
  if (result.length === 0) result.push({cat: 'Ingredients', items: items});
  return result;
}

function parseRecipeFromHtml(html, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Try JSON-LD structured data first
  const ldScripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for (const script of ldScripts) {
    try {
      let jsonData = JSON.parse(script.textContent);
      // Handle @graph arrays
      if (jsonData['@graph']) jsonData = jsonData['@graph'];
      if (Array.isArray(jsonData)) {
        const found = jsonData.find(item => item['@type'] === 'Recipe' || (Array.isArray(item['@type']) && item['@type'].includes('Recipe')));
        if (found) jsonData = found;
        else continue;
      }
      if (jsonData['@type'] === 'Recipe' || (Array.isArray(jsonData['@type']) && jsonData['@type'].includes('Recipe'))) {
        return buildRecipeFromLD(jsonData, url);
      }
    } catch(e) { continue; }
  }

  // Fallback: try meta tags
  const title = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.textContent || '';
  if (!title) return null;

  return {
    id: 'custom_' + Date.now(),
    name: title.split('|')[0].split('-')[0].trim(),
    site: new URL(url).hostname.replace('www.',''),
    url: url,
    desc: doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || '',
    tags: [],
    servings: 4,
    ingredients: [{cat:'Ingredients', items:[{name:'(imported — edit ingredients manually)', qty:''}]}],
    custom: true
  };
}

function buildRecipeFromLD(ld, url) {
  const name = ld.name || 'Unnamed Recipe';
  const desc = ld.description || '';
  const servings = parseInt(ld.recipeYield) || (Array.isArray(ld.recipeYield) ? parseInt(ld.recipeYield[0]) : 4) || 4;
  const site = new URL(url).hostname.replace('www.','');

  // Parse ingredients
  const rawIngredients = ld.recipeIngredient || ld.ingredients || [];
  const items = rawIngredients.map(splitQtyName);

  // Detect tags
  const tags = [];
  const cats = (ld.recipeCategory || []);
  const cuisines = (ld.recipeCuisine || []);
  const keywords = (ld.keywords || '');
  const allText = [name, desc, ...cats, ...cuisines, keywords].join(' ').toLowerCase();
  if (allText.includes('dairy-free') || allText.includes('dairy free')) tags.push('dairy-free');
  if (allText.includes('gluten-free') || allText.includes('gluten free')) tags.push('gluten-free');
  if (allText.includes('one-pan') || allText.includes('one pan') || allText.includes('sheet pan')) tags.push('one-pan');
  if (allText.includes('one-pot') || allText.includes('one pot')) tags.push('one-pot');

  return {
    id: 'custom_' + Date.now(),
    name: name,
    site: site,
    url: url,
    desc: desc.substring(0, 200),
    tags: tags,
    servings: servings,
    ingredients: autoCategorize(items),
    custom: true
  };
}

function showImportPreview(recipe, container) {
  let h = '<div class="import-preview">';
  h += '<h4>' + esc(recipe.name) + '</h4>';
  h += '<div class="ip-meta">' + esc(recipe.site) + ' &middot; serves ' + esc(recipe.servings) + '</div>';
  if (recipe.desc) h += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + esc(recipe.desc) + '</div>';
  const totalIng = recipe.ingredients.reduce((s,g) => s + g.items.length, 0);
  recipe.ingredients.forEach(g => {
    h += '<div class="ip-section">' + esc(g.cat) + ' (' + g.items.length + ')</div>';
    g.items.slice(0, 10).forEach(item => {
      h += '<div class="ip-item">' + (item.qty ? '<span style="color:var(--muted)">' + esc(item.qty) + '</span> ' : '') + esc(item.name) + '</div>';
    });
    if (g.items.length > 10) h += '<div class="ip-item" style="color:var(--muted)">+ ' + (g.items.length - 10) + ' more...</div>';
  });
  h += '</div>';
  container.innerHTML = h;
}

function confirmImport(recipe) {
  // Check for duplicate
  if (state.customRecipes.some(r => r.url === recipe.url)) {
    alert('This recipe has already been imported.');
    closeImportModal();
    return;
  }
  state.customRecipes.push(recipe);
  save();
  closeImportModal();
  // Mid-ritual import: drop it straight into the basket.
  if (document.getElementById('planning-wizard') && wizardStep === 1) {
    if (!wizardPicked.includes(recipe.id)) wizardPicked.push(recipe.id);
    renderWizard();
    showToast(recipe.name + ' added to the basket');
  } else {
    showToast(recipe.name + ' added to your library');
  }
  render();
}

function deleteCustomRecipe(id) {
  // Tombstone rather than splice: keeps the id present so seedRecipes() can't
  // resurrect a deleted seeded recipe, and the deletion syncs via custom_recipes.
  const r = state.customRecipes.find(r => r.id === id);
  if (r) r.deleted = true;
  else state.customRecipes = state.customRecipes.filter(x => x.id !== id);
  state.selected = state.selected.filter(sid => sid !== id);
  state.favorites = state.favorites.filter(fid => fid !== id);
  Object.keys(state.calendar).forEach(dk => {
    state.calendar[dk] = state.calendar[dk].filter(mid => mid !== id);
    if (state.calendar[dk].length === 0) delete state.calendar[dk];
  });
  Object.keys(state.checked).forEach(k => {
    if (keyMatchesRecipe(k, id)) delete state.checked[k];
  });
  save();
  render();
}

// Manual ingredient editor — lets any recipe (incl. link-only inbox adds and
// seeded recipes) get real ingredients so it appears on the shopping list.
function openIngredientEditor(id) {
  const r = getAllRecipes().find(r => r.id === id);
  if (!r) return;
  const old = document.getElementById('ingredient-editor-modal');
  if (old) old.remove();
  const lines = [];
  (r.ingredients || []).forEach(g => g.items.forEach(it => lines.push((it.qty ? it.qty + ' ' : '') + it.name)));
  let h = '<div class="modal-overlay" id="ingredient-editor-modal" onclick="if(event.target===this)this.remove()">';
  h += '<div class="modal" style="max-height:85vh">';
  h += '<h3>Edit ingredients</h3>';
  h += '<p class="modal-sub">' + esc(r.name) + ' — one ingredient per line, e.g. "500 g ground beef"</p>';
  h += '<textarea id="ingredient-editor-text" class="import-input" style="min-height:220px;resize:vertical;font-family:var(--font-mono);font-size:13px;line-height:1.6">' + esc(lines.join('\n')) + '</textarea>';
  h += '<div class="import-actions">';

  h += '<button class="btn-import" onclick="saveIngredientEdits(\'' + r.id + '\')">Save ingredients</button>';
  h += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function saveIngredientEdits(id) {
  const r = state.customRecipes.find(r => r.id === id);
  const ta = document.getElementById('ingredient-editor-text');
  if (!r || !ta) return;
  r.ingredients = parseIngredientLines(ta.value);
  r.linkOnly = false;
  save();
  const m = document.getElementById('ingredient-editor-modal');
  if (m) m.remove();
  closeRecipeDetail();
  render();
  showToast('Ingredients saved');
}

/* Clean an ingredient name for the copyable grocery list.
   Removes parenthetical notes and a trailing prep/qualifier clause (", diced",
   ", shredded", ", large", ", for serving"…), but NEVER drops the part of the
   name that identifies the item. So "Boneless, skinless chicken breast" stays
   whole, while "Cheddar cheese, shredded" becomes "Cheddar cheese". */
function cleanItemNameForCopy(raw) {
  var n = String(raw).replace(/\([^)]*\)/g, '').trim();   // drop (optional), (for sauce), etc.
  var prep = /^(diced|chopped|minced|sliced|shredded|grated|crushed|crumbled|ground|uncooked|cooked|drained|rinsed|peeled|seeded|halved|quartered|cubed|julienned|thinly sliced|finely chopped|roughly chopped|large|small|medium|to taste|to serve|for serving|for garnish|optional)\b/i;
  var parts = n.split(',');
  while (parts.length > 1 && prep.test(parts[parts.length - 1].trim())) {
    parts.pop();
  }
  return parts.join(',').replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim();
}

/* ── Copy shopping list (name-first for DoorDash/Instacart) ── */
function copyShoppingList() {
  const shopMealIds = getMealOccurrences(shopWeekOffset);
  const shopList = getShoppingList(shopMealIds, shopWeekKey(shopWeekOffset));
  let lines = [];
  shopList.forEach(group => {
    group.items.forEach(item => {
      const isChecked = item.keys.every(k => state.checked[k]);
      if (isChecked) return; // skip checked items
      const name = cleanItemNameForCopy(item.name); // keep item identity, drop only prep qualifiers
      const qty = item.qty;
      lines.push(qty ? name + ' (' + qty + ')' : name);
    });
  });
  const text = lines.join('\n');
  // Copy is the terminal act of the weekly ritual — confirm, then close the loop
  // with a completion banner that returns to Home (which shows the planned week).
  const copied = function() {
    const n = lines.length;
    const btn = document.getElementById('copy-list-btn');
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '&#10003; Copied!';
      setTimeout(() => { const b = document.getElementById('copy-list-btn'); if (b) b.innerHTML = orig; }, 2500);
    }
    const listEl = document.getElementById('list-view');
    if (listEl) {
      let banner = document.getElementById('ritual-done');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'ritual-done';
        listEl.insertBefore(banner, listEl.firstChild);
      }
      banner.style.cssText = 'background:var(--green);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)';
      banner.innerHTML =
        '<div style="font-family:var(--font-display);font-size:20px;font-weight:800;margin-bottom:4px">&#127881; Your week is planned</div>' +
        '<div style="font-size:13px;opacity:0.92;margin-bottom:14px">' + n + ' item' + (n!==1?'s':'') + ' copied — paste into DoorDash or Instacart to order.</div>' +
        '<button style="background:#fff;color:var(--green-text);border:none;font-weight:700;padding:12px 18px;border-radius:10px;width:100%;font-size:15px;cursor:pointer" onclick="showView(\'home\')">Back to this week &#8250;</button>';
      banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    showToast(n + ' item' + (n!==1?'s':'') + ' copied');
  };
  navigator.clipboard.writeText(text).then(copied).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    copied();
  });
}
