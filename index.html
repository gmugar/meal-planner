<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Meal Planner & Shopping List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0f4f0;--card:#fff;--text:#1a2e1a;--muted:#5e6e5e;--border:#d4ddd4;--accent:#3d7a4a;--accent-light:#e2f0e5;--accent-text:#1e4a26;--green:#1d9e75;--green-light:#e1f5ee;--green-text:#085041;--blue:#378add;--blue-light:#e6f1fb;--blue-text:#0c447c;--purple:#7f77dd;--purple-light:#eeedfe;--purple-text:#3c3489;--gold:#8b6d3f;--gold-light:#f5eedd;--gold-text:#5a4020;--shadow:0 1px 3px rgba(0,0,0,0.05)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:flex-start}
.header h1{font-size:20px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin-top:2px}
.sync-badge{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500;white-space:nowrap;margin-top:2px}
.sync-badge.connected{background:var(--green-light);color:var(--green-text)}
.sync-badge.connecting{background:var(--gold-light);color:var(--gold-text)}
.sync-badge.offline{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:99;overflow-x:auto}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;min-width:0}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:600;margin-left:4px;background:var(--accent-light);color:var(--accent-text)}
.view{display:none;padding:16px}
.view.active{display:block}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title-row{display:flex;align-items:flex-start;gap:8px;flex:1;min-width:0}
.card h3{font-size:16px;font-weight:500;line-height:1.3}
.card .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag-df{background:var(--green-light);color:var(--green-text)}
.tag-gf{background:var(--blue-light);color:var(--blue-text)}
.tag-one{background:var(--purple-light);color:var(--purple-text)}
.card .desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.card .source{font-size:12px;color:var(--blue);text-decoration:none;display:inline-block;margin-top:8px}
.card .source-site{font-size:11px;color:var(--muted);margin-left:8px}
.btn{padding:10px 20px;border-radius:8px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.btn-add{background:var(--accent);color:#fff}
.btn-add:active{transform:scale(0.96)}
.btn-remove{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-remove:active{transform:scale(0.96)}
.btn-sm{padding:8px 14px;font-size:13px}
.card-actions{display:flex;gap:6px;align-items:flex-start;flex-shrink:0}
.btn-star{background:none;border:none;font-size:22px;cursor:pointer;padding:4px;line-height:1;color:var(--border);transition:all 0.15s}
.btn-star.starred{color:var(--gold)}
.btn-star:active{transform:scale(1.2)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty p{font-size:14px;margin-top:8px}
.empty .icon{font-size:40px;opacity:0.3}
.section-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
.shop-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.shop-item:last-child{border-bottom:none}
.shop-item input[type=checkbox]{width:22px;height:22px;margin-top:1px;flex-shrink:0;accent-color:var(--green);cursor:pointer}
.shop-item.checked .item-name{text-decoration:line-through;color:var(--muted)}
.item-details{flex:1;min-width:0}
.item-name{font-size:15px;line-height:1.4}
.item-qty{font-size:13px;color:var(--muted);margin-top:2px}
.item-meals{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.meal-dot{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.progress-bar{background:var(--bg);border-radius:8px;height:6px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:8px;transition:width 0.3s}
.progress-text{font-size:13px;color:var(--muted);margin-bottom:16px}
.list-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-outline{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--muted);cursor:pointer}
.btn-outline:active{background:var(--bg)}
.summary-bar{background:var(--card);padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.summary-bar .count{font-size:14px;font-weight:500}
.summary-bar .servings{font-size:13px;color:var(--muted)}
.fav-banner{background:var(--gold-light);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--gold-text);display:flex;align-items:center;gap:8px}
/* Calendar */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-header h2{font-size:15px;font-weight:600}
.cal-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--text)}
.cal-nav-btn:active{background:var(--bg)}
.cal-day{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.cal-day-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.cal-day-header .day-name{font-size:14px;font-weight:600}
.cal-day-header .day-date{font-size:12px;color:var(--muted)}
.cal-day.today .cal-day-header{background:var(--accent-light)}
.cal-day.today .day-name{color:var(--accent)}
.cal-day-meals{padding:8px 12px;min-height:44px;display:flex;flex-direction:column;gap:6px}
.cal-meal{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.cal-meal-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-meal-serves{font-size:11px;color:var(--muted);margin:0 8px;flex-shrink:0}
.cal-meal-remove{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.cal-meal-remove:active{color:var(--accent)}
.btn-add-meal{display:flex;align-items:center;gap:6px;padding:10px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--muted);font-size:13px;cursor:pointer;width:100%;justify-content:center;transition:all 0.15s}
.btn-add-meal:active{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;max-height:70vh;overflow-y:auto;padding:20px;animation:slideUp 0.2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .modal-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.modal-meal{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all 0.1s}
.modal-meal:active{background:var(--accent-light);border-color:var(--accent)}
.modal-meal.added{opacity:0.5;cursor:default}
.modal-meal-info{flex:1;min-width:0}
.modal-meal-name{font-size:14px;font-weight:500}
.modal-meal-tags{font-size:11px;color:var(--muted);margin-top:2px}
.modal-cancel{display:block;width:100%;padding:12px;border:none;background:var(--bg);border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;margin-top:8px}
.modal-cancel:active{background:var(--border)}
/* Recipe Detail Modal */
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.detail-header h3{font-size:18px;font-weight:600;line-height:1.3}
.detail-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.detail-close:active{color:var(--text)}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.detail-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.detail-section{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px;margin-top:12px}
.detail-ingredient{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:14px}
.detail-ingredient:last-child{border-bottom:none}
.detail-ing-name{flex:1;min-width:0}
.detail-ing-qty{color:var(--muted);font-size:13px;flex-shrink:0;margin-left:12px;text-align:right}
.detail-source{display:inline-block;margin-top:16px;font-size:13px;color:var(--blue);text-decoration:none;padding:10px 16px;border:1px solid var(--blue);border-radius:8px;text-align:center;width:100%}
.detail-source:active{background:var(--blue-light)}
.cal-meal-name{cursor:pointer}
.cal-meal-name:active{color:var(--accent)}
.inbox-section{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.inbox-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.inbox-meal{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--accent-light);border:1px dashed var(--accent);border-radius:8px;margin-bottom:6px}
.inbox-meal:last-child{margin-bottom:0}
.inbox-meal-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.inbox-meal-name:active{color:var(--accent)}
.inbox-meal-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.inbox-assign-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer}
.inbox-assign-btn:active{opacity:0.8}
.inbox-remove-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.inbox-remove-btn:active{color:var(--accent)}
@media(min-width:600px){
  .view{max-width:600px;margin:0 auto}
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cards-grid .card{margin-bottom:0}
}
.tab-icon{display:none}
.card{padding:12px 14px}
.card h3{font-size:15px;cursor:pointer}
.card h3:active{color:var(--accent)}
.card .tags{margin-top:4px}
.progress-ring-wrap{display:flex;align-items:center;gap:16px;margin:8px 0 16px;padding:16px;background:var(--card);border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.progress-ring-info{flex:1}
.progress-ring-info .pr-count{font-size:15px;font-weight:500;color:var(--text)}
.progress-ring-info .pr-hint{font-size:12px;color:var(--muted);margin-top:4px}
@media(max-width:400px){
  .tab{flex-direction:column;padding:8px 4px;font-size:11px;gap:2px;display:flex;align-items:center;position:relative}
  .tab-icon{display:block;font-size:18px;line-height:1}
  .tab .badge{position:absolute;top:2px;right:4px;min-width:14px;height:14px;padding:0 3px;font-size:9px;border-radius:7px}
}
/* Saturday planning notification */
.plan-notify{background:var(--accent-light);border:1px solid var(--accent);border-radius:12px;margin:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:slideDown 0.3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.plan-notify .plan-icon{font-size:28px;flex-shrink:0}
.plan-notify .plan-text{flex:1}
.plan-notify .plan-title{font-size:15px;font-weight:600;color:var(--accent-text)}
.plan-notify .plan-sub{font-size:13px;color:var(--muted);margin-top:2px}
.plan-notify .plan-actions{display:flex;gap:8px;flex-shrink:0}
.plan-go{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer}
.plan-go:active{opacity:0.85}
.plan-later{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer}
/* Planning wizard */
.wizard-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:300;overflow-y:auto;animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.wizard-header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:301}
.wizard-header h2{font-size:18px;font-weight:600}
.wizard-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:0 4px;line-height:1}
.wizard-body{padding:16px;max-width:600px;margin:0 auto}
.wizard-step{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.wizard-hint{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.wizard-recipe{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer;transition:all 0.15s}
.wizard-recipe:active{transform:scale(0.98)}
.wizard-recipe.picked{border-color:var(--accent);background:var(--accent-light)}
.wizard-recipe-info{flex:1;min-width:0}
.wizard-recipe-name{font-size:14px;font-weight:500}
.wizard-recipe-meta{font-size:11px;color:var(--muted);margin-top:2px}
.wizard-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:transparent;transition:all 0.15s}
.wizard-recipe.picked .wizard-check{border-color:var(--accent);background:var(--accent);color:#fff}
.wizard-footer{padding:16px 20px;background:var(--card);border-top:1px solid var(--border);position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center}
.wizard-footer .btn{min-width:120px;text-align:center}
.wizard-count{font-size:14px;color:var(--muted)}
.week-option{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:pointer;transition:all 0.15s}
.week-option:active{background:var(--accent-light);border-color:var(--accent)}
.week-option-info{flex:1}
.week-option-label{font-size:14px;font-weight:500}
.week-option-dates{font-size:12px;color:var(--muted);margin-top:2px}
.week-option-arrow{color:var(--muted);font-size:18px;flex-shrink:0}
/* Import recipe */
.import-input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;background:var(--bg);color:var(--text)}
.import-input:focus{outline:none;border-color:var(--accent)}
.import-status{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:20px}
.import-status.error{color:#c0392b}
.import-preview{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg)}
.import-preview h4{font-size:15px;font-weight:600;margin-bottom:4px}
.import-preview .ip-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.import-preview .ip-section{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-top:10px;margin-bottom:4px}
.import-preview .ip-item{font-size:13px;padding:2px 0;color:var(--text)}
.import-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-import{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:500;cursor:pointer}
.btn-import:active{opacity:0.85}
.btn-import:disabled{opacity:0.4;cursor:default}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Meal Planner</h1>
    <p>Simple Home Edit &middot; Budget Bytes &middot; Half Baked Harvest</p>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="plan-go" onclick="openImportModal()" style="padding:6px 12px;font-size:12px">+ Add Recipe</button>
    <button class="plan-go" onclick="openWeekPicker()" style="padding:6px 12px;font-size:12px">+ New Plan</button>
    <div class="sync-badge connecting" id="sync-status">connecting...</div>
  </div>
</div>
<div id="plan-notification"></div>

  <button class="tab" onclick="showView('list')"><span class="tab-icon">&#128722;</span>Shop<span class="badge" id="list-count">0</span></button>
</div>

<div id="browse-view" class="view active"></div>
<div id="favorites-view" class="view"></div>
<div id="calendar-view" class="view"></div>
<div id="list-view" class="view"></div>

/* ── State management with Supabase sync ── */
let state = { selected: [], checked: {}, favorites: [], calendar: {}, customRecipes: [] };

// Load from localStorage first for instant render
const cached = localStorage.getItem('mealPlannerState');
if (cached) {
  try {
    const parsed = JSON.parse(cached);
    state = { selected: parsed.selected || [], checked: parsed.checked || {}, favorites: parsed.favorites || [], calendar: parsed.calendar || {}, customRecipes: parsed.customRecipes || [] };
  } catch(e) {}
}

function getAllRecipes() { return [...RECIPES, ...state.customRecipes]; }

function setSyncStatus(status) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-badge ' + status;
  el.textContent = status === 'connected' ? 'synced' : status === 'connecting' ? 'connecting...' : 'offline';
}

async function loadFromSupabase() {
  try {
    const { data, error } = await sb.from('meal_state').select('*').eq('id', 1).single();
    if (error) throw error;
    if (data) {
      state.selected = data.selected || [];
      state.checked = data.checked || {};
      state.favorites = data.favorites || [];
      state.calendar = data.calendar || {};
      localStorage.setItem('mealPlannerState', JSON.stringify(state));
      render();
    }
    syncConnected = true;
    setSyncStatus('connected');
  } catch(e) {
    console.log('Supabase load failed, using local cache:', e.message);
    syncConnected = false;
    setSyncStatus('offline');
  }
}

async function saveToSupabase() {
  if (saving) return;
  saving = true;
  localStorage.setItem('mealPlannerState', JSON.stringify(state));
  try {
    const { error } = await sb.from('meal_state').upsert({
      id: 1,
      selected: state.selected,
      checked: state.checked,
      favorites: state.favorites,
      calendar: state.calendar,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
    syncConnected = true;
    setSyncStatus('connected');
  } catch(e) {
    console.log('Supabase save failed:', e.message);
    setSyncStatus('offline');
  }
  saving = false;
}

function save() {
  saveToSupabase();
}

// Realtime subscription
sb.channel('meal_state_changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'meal_state' }, (payload) => {
    if (saving) return; // ignore our own writes
    const data = payload.new;
    if (data) {
      state.selected = data.selected || [];
      state.checked = data.checked || {};
      state.favorites = data.favorites || [];
      state.calendar = data.calendar || {};
      localStorage.setItem('mealPlannerState', JSON.stringify(state));
      render();
    }
  })
  .subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      syncConnected = true;
      setSyncStatus('connected');
    }
  });

// Initial load from Supabase
loadFromSupabase();

function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const views = ['browse','favorites','calendar','list'];
  document.getElementById(view+'-view').classList.add('active');
  document.querySelectorAll('.tab')[views.indexOf(view)].classList.add('active');
  render();
}

function toggleMeal(id) {
  const idx = state.selected.indexOf(id);
  if (idx === -1) {
    state.selected.push(id);
  } else {
    state.selected.splice(idx, 1);
    Object.keys(state.checked).forEach(k => {
      if (k.startsWith(id+'|')) delete state.checked[k];
    });
  }
  save();
  render();
}

function toggleFavorite(id) {
  const idx = state.favorites.indexOf(id);
  if (idx === -1) {
    state.favorites.push(id);
  } else {
    state.favorites.splice(idx, 1);
  }
  save();
  render();
}

function toggleCheck(key) {
  state.checked[key] = !state.checked[key];
  save();
  render();
}

function uncheckAll() {
  state.checked = {};
  save();
  render();
}

/* ── Calendar ── */
let calWeekOffset = 0;
let pickerDate = null;

function getWeekDates(offset) {
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + (offset * 7));
  mon.setHours(0,0,0,0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function dateKey(d) { return d.toISOString().split('T')[0]; }

function isToday(d) {
  const n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

function fmtDate(d) {
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()] + ' ' + d.getDate();
}

function dayName(d) {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
}

function changeWeek(dir) { calWeekOffset += dir; render(); }

function openMealPicker(dateStr) {
  pickerDate = dateStr;
  renderPicker();
}

function closePicker() {
  pickerDate = null;
  const m = document.getElementById('meal-picker-modal');
  if (m) m.remove();
}

function renderPicker() {
  if (!pickerDate) return;
  const old = document.getElementById('meal-picker-modal');
  if (old) old.remove();
  const dayMeals = state.calendar[pickerDate] || [];
  const d = new Date(pickerDate + 'T12:00:00');
  // Show approved meals first, then unapproved
  const approvedRecipes = getAllRecipes().filter(r => state.selected.includes(r.id));
  const otherRecipes = getAllRecipes().filter(r => !state.selected.includes(r.id));
  let h = '<div class="modal-overlay" id="meal-picker-modal" onclick="if(event.target===this)closePicker()">';
  h += '<div class="modal">';
  h += '<h3>Add meal to ' + dayName(d) + '</h3>';
  h += '<p class="modal-sub">' + fmtDate(d) + '</p>';
  if (approvedRecipes.length > 0) {
    approvedRecipes.forEach(r => {
      const added = dayMeals.includes(r.id);
      h += '<div class="modal-meal' + (added?' added':'') + '" ' + (added?'':'onclick="addMealToDay(\''+pickerDate+'\',\''+r.id+'\')"') + '>';
      h += '<div class="modal-meal-info"><div class="modal-meal-name">' + r.name + '</div>';
      h += '<div class="modal-meal-tags">serves ' + r.servings + (added?' · already added':'') + '</div></div>';
      if (!added) h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
      h += '</div>';
    });
  }
  if (otherRecipes.length > 0) {
    if (approvedRecipes.length > 0) h += '<div class="section-label" style="margin-top:8px">More recipes</div>';
    otherRecipes.forEach(r => {
      const added = dayMeals.includes(r.id);
      h += '<div class="modal-meal' + (added?' added':'') + '" ' + (added?'':'onclick="addMealToDayAndSelect(\''+pickerDate+'\',\''+r.id+'\')"') + '>';
      h += '<div class="modal-meal-info"><div class="modal-meal-name">' + r.name + '</div>';
      h += '<div class="modal-meal-tags">serves ' + r.servings + (added?' · already added':'') + '</div></div>';
      if (!added) h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
      h += '</div>';
    });
  }
  h += '<button class="modal-cancel" onclick="closePicker()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function addMealToDay(dateStr, mealId) {
  if (!state.calendar[dateStr]) state.calendar[dateStr] = [];
  if (!state.calendar[dateStr].includes(mealId)) state.calendar[dateStr].push(mealId);
  save();
  closePicker();
  render();
}

function addMealToDayAndSelect(dateStr, mealId) {
  if (!state.selected.includes(mealId)) state.selected.push(mealId);
  addMealToDay(dateStr, mealId);
}

function removeMealFromDay(dateStr, mealId) {
  if (!state.calendar[dateStr]) return;
  state.calendar[dateStr] = state.calendar[dateStr].filter(id => id !== mealId);
  if (state.calendar[dateStr].length === 0) delete state.calendar[dateStr];
  save();
  render();
}

  const r = getAllRecipes().find(r => r.id === mealId);
  if (!r) return;
  const old = document.getElementById('inbox-assign-modal');
  if (old) old.remove();
  const weekDates = getWeekDates(calWeekOffset);
  let h = '<div class="modal-overlay" id="inbox-assign-modal" onclick="if(event.target===this)closeInboxAssign()">';

  h += '<h3>Assign ' + r.name + '</h3>';

    h += '<span style="color:var(--accent);font-size:20px;font-weight:300">+</span>';
    h += '</div>';
  });
  h += '<button class="modal-cancel" onclick="closeInboxAssign()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function getShoppingList() {
  const catOrder = ['Meat','Produce','Dairy','Pantry','Spices','Noodles & Pasta'];
  const groups = {};

  state.selected.forEach(id => {
    const r = getAllRecipes().find(r => r.id === id);
    if (!r) return;
    r.ingredients.forEach(g => {
      if (!groups[g.cat]) groups[g.cat] = [];
      g.items.forEach(item => {
        groups[g.cat].push({
          name: item.name,
          qty: item.qty,
          meal: r.name,
          mealId: r.id,
          key: r.id + '|' + item.name
        });
      });
    });
  });

  const consolidated = {};
  Object.keys(groups).forEach(cat => {
    consolidated[cat] = [];
    const seen = {};
    groups[cat].forEach(item => {
      const normName = item.name.toLowerCase().replace(/,.*$/,'').trim();
      if (seen[normName]) {
        seen[normName].meals.push(item.meal);
        seen[normName].keys.push(item.key);
        if (item.qty !== seen[normName].qty) {
          seen[normName].qty += ' + ' + item.qty;
        }
      } else {
        const entry = {name: item.name, qty: item.qty, meals:[item.meal], keys:[item.key]};
        seen[normName] = entry;
        consolidated[cat].push(entry);
      }
    });
  });

  const sorted = [];
  catOrder.forEach(cat => {
    if (consolidated[cat]) sorted.push({cat, items: consolidated[cat]});
  });
  Object.keys(consolidated).forEach(cat => {
    if (!catOrder.includes(cat)) sorted.push({cat, items: consolidated[cat]});
  });
  return sorted;
}

function render() {
  const browseEl = document.getElementById('browse-view');
  const favEl = document.getElementById('favorites-view');
  const listEl = document.getElementById('list-view');

  document.getElementById('browse-count').textContent = getAllRecipes().length;
  document.getElementById('meals-count').textContent = state.selected.length;
  document.getElementById('fav-count').textContent = state.favorites.length;

  // Browse view
  const approved = getAllRecipes().filter(r => state.selected.includes(r.id));
  const available = getAllRecipes().filter(r => !state.selected.includes(r.id));

  let browseHTML = '';
  if (approved.length > 0) {
    browseHTML += '<div class="section-label">Approved (' + approved.length + ')</div>';
    approved.forEach(r => { browseHTML += renderCard(r, true); });
  }
  if (available.length > 0) {
    browseHTML += '<div class="section-label">Available (' + available.length + ')</div>';
    available.forEach(r => { browseHTML += renderCard(r, false); });
  }
  browseEl.innerHTML = browseHTML;

  // Favorites view
  const favRecipes = getAllRecipes().filter(r => state.favorites.includes(r.id));
  if (favRecipes.length === 0) {
    favEl.innerHTML = '<div class="empty"><div class="icon">&#11088;</div><p>No favorites yet.<br>Star recipes you love to save them here.</p></div>';
  } else {
    let favHTML = '<div class="fav-banner">&#11088; Your starred recipes — tap the star on any meal to save it here for easy access.</div>';
    favRecipes.forEach(r => {
      const isSelected = state.selected.includes(r.id);
      favHTML += renderCard(r, isSelected);
    });
    favEl.innerHTML = favHTML;
  }

  // Calendar view
  const calEl = document.getElementById('calendar-view');
  const weekDates = getWeekDates(calWeekOffset);
  let calHTML = '<div class="cal-header">';
  calHTML += '<button class="cal-nav-btn" onclick="changeWeek(-1)">&larr; Prev</button>';
  calHTML += '<h2>' + fmtDate(weekDates[0]) + ' — ' + fmtDate(weekDates[6]) + '</h2>';
  calHTML += '<button class="cal-nav-btn" onclick="changeWeek(1)">Next &rarr;</button>';
  calHTML += '</div>';
  if (state.selected.length === 0) {
    calHTML += '<div class="empty"><div class="icon">&#128197;</div><p>Add meals from the Browse tab first,<br>then assign them to days here.</p></div>';
  } else {
    // Unassigned meals inbox — meals selected but not on any day this week
    const assignedThisWeek = new Set();
    weekDates.forEach(d => {
      (state.calendar[dateKey(d)]||[]).forEach(id => assignedThisWeek.add(id));
    });
    const unassigned = state.selected.filter(id => !assignedThisWeek.has(id)).map(id => getAllRecipes().find(r=>r.id===id)).filter(Boolean);
    if (unassigned.length > 0) {
      calHTML += '<div class="inbox-section">';
      calHTML += '<div class="inbox-label">&#128229; Unassigned (' + unassigned.length + ')</div>';
      unassigned.forEach(r => {
        calHTML += '<div class="inbox-meal">';
        calHTML += '<span class="inbox-meal-name" onclick="openRecipeDetail(\'' + r.id + '\')">' + r.name + '</span>';
        calHTML += '<div class="inbox-meal-actions">';
        calHTML += '<button class="inbox-assign-btn" onclick="openInboxAssign(\'' + r.id + '\')">Assign</button>';
        calHTML += '<button class="inbox-remove-btn" onclick="toggleMeal(\'' + r.id + '\')" title="Remove meal">&times;</button>';
        calHTML += '</div></div>';
      });
      calHTML += '</div>';
    }

    weekDates.forEach(d => {
      const dk = dateKey(d);
      const today = isToday(d);
      const meals = (state.calendar[dk]||[]).map(id => getAllRecipes().find(r=>r.id===id)).filter(Boolean);
      calHTML += '<div class="cal-day' + (today?' today':'') + '">';
      calHTML += '<div class="cal-day-header"><span class="day-name">' + dayName(d) + (today?' · Today':'') + '</span><span class="day-date">' + fmtDate(d) + '</span></div>';
      calHTML += '<div class="cal-day-meals">';
      meals.forEach(r => {
        calHTML += '<div class="cal-meal"><span class="cal-meal-name" onclick="event.stopPropagation();openRecipeDetail(\'' + r.id + '\')">' + r.name + '</span>';
        calHTML += '<span class="cal-meal-serves">serves ' + r.servings + '</span>';
        calHTML += '<button class="cal-meal-remove" onclick="removeMealFromDay(\'' + dk + '\',\'' + r.id + '\')">&times;</button></div>';
      });
      calHTML += '<button class="btn-add-meal" onclick="openMealPicker(\'' + dk + '\')">+ Add meal</button>';
      calHTML += '</div></div>';
    });
  }
  calEl.innerHTML = calHTML;

  // Shopping list view
  const shopList = getShoppingList();
  if (state.selected.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="icon">&#128722;</div><p>Add meals to generate<br>your shopping list.</p></div>';
    document.getElementById('list-count').textContent = '0';
  } else {
    let totalItems = 0;
    let checkedItems = 0;
    shopList.forEach(g => g.items.forEach(item => {
      totalItems++;
      if (item.keys.every(k => state.checked[k])) checkedItems++;
    }));
    document.getElementById('list-count').textContent = totalItems - checkedItems || totalItems;

    const pct = totalItems ? Math.round((checkedItems / totalItems) * 100) : 0;
    const circ = 2 * Math.PI * 34;
    const offset = circ - (circ * pct / 100);
    // Find a contextual hint
    let hint = '';
    if (pct === 100) { hint = 'All done!'; }
    else if (pct === 0) { hint = 'Start checking items off'; }
    else {
      const doneCategories = [];
      shopList.forEach(g => {
        const allDone = g.items.every(item => item.keys.every(k => state.checked[k]));
        if (allDone) doneCategories.push(g.cat);
      });
      if (doneCategories.length > 0) hint = doneCategories[doneCategories.length-1] + ' section done';
      else hint = 'Keep going!';
    }
    let html = '<div class="progress-ring-wrap">';
    html += '<svg width="72" height="72" viewBox="0 0 80 80">';
    html += '<circle cx="40" cy="40" r="34" fill="none" stroke="var(--border)" stroke-width="6"/>';
    html += '<circle cx="40" cy="40" r="34" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset 0.4s"/>';
    html += '<text x="40" y="37" text-anchor="middle" font-size="18" font-weight="600" fill="var(--text)">' + pct + '%</text>';
    html += '<text x="40" y="52" text-anchor="middle" font-size="9" fill="var(--muted)">' + checkedItems + '/' + totalItems + '</text>';
    html += '</svg>';
    html += '<div class="progress-ring-info"><div class="pr-count">' + checkedItems + ' of ' + totalItems + ' items</div>';
    html += '<div class="pr-hint">' + hint + '</div></div></div>';
    html += '<div class="list-actions"><button class="btn-outline" onclick="copyShoppingList()">&#128203; Copy list</button><button class="btn-outline" onclick="uncheckAll()">Uncheck all</button></div>';

    shopList.forEach(group => {
      html += '<div class="section-label">' + group.cat + '</div>';
      group.items.forEach(item => {
        const isChecked = item.keys.every(k => state.checked[k]);
        html += '<div class="shop-item' + (isChecked ? ' checked' : '') + '">';
        html += '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onchange="toggleCheckGroup(\'' + item.keys.map(k=>k.replace(/'/g,"\\'")).join("','") + '\')">';
        html += '<div class="item-details">';
        html += '<div class="item-name">' + item.name + '</div>';
        html += '<div class="item-qty">' + item.qty + '</div>';
        html += '<div class="item-meals">';
        const uniqueMeals = [...new Set(item.meals)];
        uniqueMeals.forEach(m => {
          html += '<span class="meal-dot">' + m.split(' ').slice(0,3).join(' ') + '</span>';
        });
        html += '</div></div></div>';
      });
    });
    listEl.innerHTML = html;
  }
}

function toggleCheckGroup() {
  const keys = Array.from(arguments);
  const allChecked = keys.every(k => state.checked[k]);
  keys.forEach(k => state.checked[k] = !allChecked);
  save();
  render();
}

function renderCard(r, isSelected) {
  const isFav = state.favorites.includes(r.id);
  let html = '<div class="card">';
  html += '<div class="card-header"><div class="card-title-row"><div>';
  html += '<h3 onclick="openRecipeDetail(\'' + r.id + '\')">' + r.name + '</h3>';
  html += '<div class="tags">';
  r.tags.forEach(t => {
    if (t==='dairy-free') html += '<span class="tag tag-df">DF</span>';
    else if (t==='gluten-free') html += '<span class="tag tag-gf">GF</span>';
    else if (t.startsWith('one-')) html += '<span class="tag tag-one">' + t + '</span>';
    else if (t==='fakeaway') html += '<span class="tag tag-one">fakeaway</span>';
  });
  html += '<span class="tag" style="background:var(--bg);color:var(--muted);border:1px solid var(--border)">serves ' + r.servings + '</span>';
  html += '</div></div></div>';
  html += '<div class="card-actions">';
  html += '<button class="btn-star' + (isFav ? ' starred' : '') + '" onclick="toggleFavorite(\'' + r.id + '\')" aria-label="' + (isFav ? 'Remove from favorites' : 'Add to favorites') + '">' + (isFav ? '&#9733;' : '&#9734;') + '</button>';
  if (isSelected) {
    html += '<button class="btn btn-remove btn-sm" onclick="toggleMeal(\'' + r.id + '\')">Remove</button>';
  } else {
    html += '<button class="btn btn-add btn-sm" onclick="toggleMeal(\'' + r.id + '\')">Add</button>';
  }
  html += '</div></div>';
  html += '</div>';
  return html;
}

/* ── Weekly planning wizard ── */
let wizardWeekOffset = 1;
let wizardPicked = [];

function getWeekKey(d) {
  const mon = new Date(d);
  mon.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1));
  return mon.toISOString().split('T')[0];
}

// Saturday notification
function checkSaturdayNotification() {
  const now = new Date();
  if (now.getDay() !== 6) return;
  const wk = 'planDismissed_' + getWeekKey(now);
  if (localStorage.getItem(wk)) return;
  const el = document.getElementById('plan-notification');
  el.innerHTML = '<div class="plan-notify">' +
    '<div class="plan-icon">&#128203;</div>' +
    '<div class="plan-text"><div class="plan-title">Ready to plan next week?</div>' +
    '<div class="plan-sub">Pick recipes and assign them to days</div></div>' +
    '<div class="plan-actions">' +
    '<button class="plan-go" onclick="dismissPlanNotify();openWeekPicker()">Let\'s plan</button>' +
    '<button class="plan-later" onclick="dismissPlanNotify()">Later</button>' +
    '</div></div>';
}

function dismissPlanNotify() {
  const wk = 'planDismissed_' + getWeekKey(new Date());
  localStorage.setItem(wk, '1');
  document.getElementById('plan-notification').innerHTML = '';
}

// Week picker modal
function openWeekPicker() {
  const old = document.getElementById('week-picker-modal');
  if (old) old.remove();
  let h = '<div class="modal-overlay" id="week-picker-modal" onclick="if(event.target===this)closeWeekPicker()">';
  h += '<div class="modal">';
  h += '<h3>Plan which week?</h3>';
  h += '<p class="modal-sub">Choose the week you want to plan meals for</p>';
  for (let i = 0; i <= 2; i++) {
    const dates = getWeekDates(i);
    const mon = dates[0]; const sun = dates[6];
    const label = i === 0 ? 'This week' : i === 1 ? 'Next week' : 'In 2 weeks';
    const existingMeals = dates.reduce((c,d) => c + (state.calendar[dateKey(d)]||[]).length, 0);
    h += '<div class="week-option" onclick="selectWeekAndPlan('+i+')">';
    h += '<div class="week-option-info"><div class="week-option-label">' + label + '</div>';
    h += '<div class="week-option-dates">' + fmtDate(mon) + ' — ' + fmtDate(sun);
    if (existingMeals > 0) h += ' · ' + existingMeals + ' meal' + (existingMeals!==1?'s':'') + ' planned';
    h += '</div></div>';
    h += '<span class="week-option-arrow">&#8250;</span>';
    h += '</div>';
  }
  h += '<button class="modal-cancel" onclick="closeWeekPicker()">Cancel</button>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function closeWeekPicker() {
  const m = document.getElementById('week-picker-modal');
  if (m) m.remove();
}

function selectWeekAndPlan(offset) {
  wizardWeekOffset = offset;
  wizardPicked = [...state.selected];
  closeWeekPicker();
  renderWizard();
}

// Planning wizard
function renderWizard() {
  const old = document.getElementById('planning-wizard');
  if (old) old.remove();
  const dates = getWeekDates(wizardWeekOffset);
  const weekLabel = fmtDate(dates[0]) + ' — ' + fmtDate(dates[6]);

  let h = '<div class="wizard-overlay" id="planning-wizard">';
  h += '<div class="wizard-header"><h2>Plan: ' + weekLabel + '</h2>';
  h += '<button class="wizard-close" onclick="closeWizard()">&times;</button></div>';
  h += '<div class="wizard-body">';
  h += '<div class="wizard-step">Step 1 of 2 &middot; Choose Recipes</div>';
  h += '<p class="wizard-hint">Tap recipes to add them to your plan. You\'ll assign them to specific days next.</p>';

  // Show favorites first if any
  const favRecipes = getAllRecipes().filter(r => state.favorites.includes(r.id));
  const otherRecipes = getAllRecipes().filter(r => !state.favorites.includes(r.id));
  const ordered = [...favRecipes, ...otherRecipes];

  if (favRecipes.length > 0) {
    h += '<div class="section-label" style="padding-top:8px">&#9733; Favorites</div>';
  }

  ordered.forEach((r, idx) => {
    if (favRecipes.length > 0 && idx === favRecipes.length) {
      h += '<div class="section-label" style="padding-top:8px">All Recipes</div>';
    }
    const isPicked = wizardPicked.includes(r.id);
    h += '<div class="wizard-recipe' + (isPicked ? ' picked' : '') + '" onclick="toggleWizardPick(\'' + r.id + '\')">';
    h += '<div class="wizard-recipe-info"><div class="wizard-recipe-name">' + r.name + '</div>';
    h += '<div class="wizard-recipe-meta">';
    r.tags.forEach(t => { h += t + ' · '; });
    h += 'serves ' + r.servings + '</div></div>';
    h += '<div class="wizard-check">' + (isPicked ? '&#10003;' : '') + '</div>';
    h += '</div>';
  });

  h += '</div>';
  h += '<div class="wizard-footer">';
  h += '<div class="wizard-count">' + wizardPicked.length + ' meal' + (wizardPicked.length!==1?'s':'') + ' selected</div>';
  if (wizardPicked.length > 0) {
    h += '<button class="btn btn-add" onclick="wizardContinue()">Assign to days &#8250;</button>';
  } else {
    h += '<button class="btn btn-add" style="opacity:0.4;cursor:default">Assign to days &#8250;</button>';
  }
  h += '</div></div>';

  document.body.insertAdjacentHTML('beforeend', h);
}

function toggleWizardPick(id) {
  const idx = wizardPicked.indexOf(id);
  if (idx === -1) wizardPicked.push(id);
  else wizardPicked.splice(idx, 1);
  renderWizard();
}

function closeWizard() {
  const el = document.getElementById('planning-wizard');
  if (el) el.remove();
}

function wizardContinue() {
  if (wizardPicked.length === 0) return;
  // Merge wizard picks into state.selected (add any new ones)
  wizardPicked.forEach(id => {
    if (!state.selected.includes(id)) state.selected.push(id);
  });
  save();
  closeWizard();

  // Navigate to the chosen week in calendar
  calWeekOffset = wizardWeekOffset;
  showView('calendar');
}

/* ── Recipe import from URL ── */
function openImportModal() {
  const old = document.getElementById('import-modal');
  if (old) old.remove();
  let h = '<div class="modal-overlay" id="import-modal" onclick="if(event.target===this)closeImportModal()">';
  h += '<div class="modal" style="max-height:85vh">';
  h += '<h3>Add Recipe from URL</h3>';
  h += '<p class="modal-sub">Paste a recipe URL and we\'ll extract the ingredients</p>';
  h += '<input class="import-input" id="import-url" type="url" placeholder="https://example.com/recipe/..." autofocus>';
  h += '<div class="import-status" id="import-status"></div>';
  h += '<div id="import-preview-area"></div>';
  h += '<div class="import-actions">';
  h += '<button class="modal-cancel" onclick="closeImportModal()" style="width:auto;margin:0">Cancel</button>';
  h += '<button class="btn-import" id="import-btn" onclick="doImport()">Import Recipe</button>';
  h += '</div>';
  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  document.getElementById('import-url').addEventListener('keydown', e => { if (e.key==='Enter') doImport(); });
}

function closeImportModal() {
  const m = document.getElementById('import-modal');
  if (m) m.remove();
}

async function doImport() {
  const urlInput = document.getElementById('import-url');
  const statusEl = document.getElementById('import-status');
  const previewEl = document.getElementById('import-preview-area');
  const btn = document.getElementById('import-btn');
  const url = urlInput.value.trim();
  if (!url) { statusEl.className='import-status error'; statusEl.textContent='Please enter a URL'; return; }

  btn.disabled = true;
  statusEl.className='import-status';
  statusEl.innerHTML='<span class="spinner"></span>Fetching recipe...';
  previewEl.innerHTML='';

  try {
    // Try multiple CORS proxies
    const proxies = [
      { url: 'https://api.allorigins.win/get?url=' + encodeURIComponent(url), json: true, field: 'contents' },
      { url: 'https://corsproxy.io/?' + encodeURIComponent(url), json: false },
      { url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), json: false }
    ];
    let html = null;
    for (const proxy of proxies) {
      try {
        const res = await fetch(proxy.url);
        if (!res.ok) continue;
        if (proxy.json) { const d = await res.json(); html = d[proxy.field]; }
        else { html = await res.text(); }
        if (html && html.length > 500) break;
        html = null;
      } catch(e) { continue; }
    }
    if (!html) throw new Error('Could not fetch page. The site may be blocking access.');

    const recipe = parseRecipeFromHtml(html, url);
    if (!recipe) throw new Error('No recipe data found on this page. Try a recipe page with structured data.');

    statusEl.innerHTML='&#10003; Recipe found!';
    statusEl.className='import-status';
    showImportPreview(recipe, previewEl);
    btn.textContent='Add to Meal Planner';
    btn.disabled=false;
    btn.onclick = function() { confirmImport(recipe); };
  } catch(e) {
    statusEl.className='import-status error';
    statusEl.textContent='Error: ' + e.message;
    btn.disabled=false;
    btn.textContent='Import Recipe';
    btn.onclick=doImport;
  }
}

function parseRecipeFromHtml(html, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // Try JSON-LD structured data first
  const ldScripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for (const script of ldScripts) {
    try {
      let jsonData = JSON.parse(script.textContent);
      // Handle @graph arrays
      if (jsonData['@graph']) jsonData = jsonData['@graph'];
      if (Array.isArray(jsonData)) {
        const found = jsonData.find(item => item['@type'] === 'Recipe' || (Array.isArray(item['@type']) && item['@type'].includes('Recipe')));
        if (found) jsonData = found;
        else continue;
      }
      if (jsonData['@type'] === 'Recipe' || (Array.isArray(jsonData['@type']) && jsonData['@type'].includes('Recipe'))) {
        return buildRecipeFromLD(jsonData, url);
      }
    } catch(e) { continue; }
  }

  // Fallback: try meta tags
  const title = doc.querySelector('meta[property="og:title"]')?.content || doc.querySelector('title')?.textContent || '';
  if (!title) return null;

  return {
    id: 'custom_' + Date.now(),
    name: title.split('|')[0].split('-')[0].trim(),
    site: new URL(url).hostname.replace('www.',''),
    url: url,
    desc: doc.querySelector('meta[property="og:description"]')?.content || doc.querySelector('meta[name="description"]')?.content || '',
    tags: [],
    servings: 4,
    ingredients: [{cat:'Ingredients', items:[{name:'(imported — edit ingredients manually)', qty:''}]}],
    custom: true
  };
}

function buildRecipeFromLD(ld, url) {
  const name = ld.name || 'Unnamed Recipe';
  const desc = ld.description || '';
  const servings = parseInt(ld.recipeYield) || (Array.isArray(ld.recipeYield) ? parseInt(ld.recipeYield[0]) : 4) || 4;
  const site = new URL(url).hostname.replace('www.','');

  // Parse ingredients
  const rawIngredients = ld.recipeIngredient || ld.ingredients || [];
  const items = rawIngredients.map(ing => {
    ing = ing.replace(/<[^>]*>/g, '').trim();
    // Try to split qty from name: match leading numbers/fractions/units
    const match = ing.match(/^([\d¼½¾⅓⅔⅛\s\/\.\-]+(?:\s*(?:cup|cups|tbsp|tsp|oz|lb|lbs|pound|pounds|g|kg|ml|L|clove|cloves|can|cans|bunch|head|large|medium|small|pinch|dash|to taste|tablespoon|tablespoons|teaspoon|teaspoons|ounce|ounces|slice|slices|piece|pieces)s?)?)\s+(.+)/i);
    if (match) return { name: match[2].trim(), qty: match[1].trim() };
    return { name: ing, qty: '' };
  });

  // Detect tags
  const tags = [];
  const cats = (ld.recipeCategory || []);
  const cuisines = (ld.recipeCuisine || []);
  const keywords = (ld.keywords || '');
  const allText = [name, desc, ...cats, ...cuisines, keywords].join(' ').toLowerCase();
  if (allText.includes('dairy-free') || allText.includes('dairy free')) tags.push('dairy-free');
  if (allText.includes('gluten-free') || allText.includes('gluten free')) tags.push('gluten-free');
  if (allText.includes('one-pan') || allText.includes('one pan') || allText.includes('sheet pan')) tags.push('one-pan');
  if (allText.includes('one-pot') || allText.includes('one pot')) tags.push('one-pot');

  return {
    id: 'custom_' + Date.now(),
    name: name,
    site: site,
    url: url,
    desc: desc.substring(0, 200),
    tags: tags,
    servings: servings,
    ingredients: [{ cat: 'Ingredients', items: items }],
    custom: true
  };
}

function showImportPreview(recipe, container) {
  let h = '<div class="import-preview">';
  h += '<h4>' + recipe.name + '</h4>';
  h += '<div class="ip-meta">' + recipe.site + ' &middot; serves ' + recipe.servings + '</div>';
  if (recipe.desc) h += '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' + recipe.desc + '</div>';
  h += '<div class="ip-section">Ingredients (' + recipe.ingredients[0].items.length + ')</div>';
  recipe.ingredients[0].items.slice(0, 15).forEach(item => {
    h += '<div class="ip-item">' + (item.qty ? '<span style="color:var(--muted)">' + item.qty + '</span> ' : '') + item.name + '</div>';
  });
  if (recipe.ingredients[0].items.length > 15) h += '<div class="ip-item" style="color:var(--muted)">+ ' + (recipe.ingredients[0].items.length - 15) + ' more...</div>';
  h += '</div>';
  container.innerHTML = h;
}

function confirmImport(recipe) {
  // Check for duplicate
  if (state.customRecipes.some(r => r.url === recipe.url)) {
    alert('This recipe has already been imported.');
    closeImportModal();
    return;
  }
  state.customRecipes.push(recipe);
  save();
  closeImportModal();
  render();
}

/* ── Copy shopping list (name-first for DoorDash/Instacart) ── */
function copyShoppingList() {
  const shopList = getShoppingList();
  let lines = [];
  shopList.forEach(group => {
    group.items.forEach(item => {
      const isChecked = item.keys.every(k => state.checked[k]);
      if (isChecked) return; // skip checked items
      const name = item.name.replace(/,.*$/, '').trim(); // clean trailing qualifiers
      const qty = item.qty;
      lines.push(qty ? name + ' (' + qty + ')' : name);
    });
  });
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.list-actions button');
    const orig = btn.innerHTML;
    btn.innerHTML = '&#10003; Copied!';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.querySelector('.list-actions button');
    const orig = btn.innerHTML;
    btn.innerHTML = '&#10003; Copied!';
    setTimeout(() => { btn.innerHTML = orig; }, 1500);
  });
}

checkSaturdayNotification();
render();
</script>
</body>
</html>
